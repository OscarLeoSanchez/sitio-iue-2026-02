<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Tres formas de seleccionar: getElementById y querySelector devuelven un elemento o null; querySelectorAll devuelve una NodeList estática, vacía si no hay coincidencias" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="fl-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="fl-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="fl-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker></defs>
  <rect x="20" y="30" width="330" height="60" rx="8" fill="#f6f8fa" stroke="#5b6876" stroke-width="1.8"/>
  <text x="185.0" y="64.0" font-size="11.5" fill="#16202b" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" style="white-space:pre">document.getElementById("lista")</text>
  <path d="M 350 60 L 418 60" stroke="#2f7bb8" stroke-width="1.6" fill="none" marker-end="url(#fl-blue)"/>
  <rect x="420" y="30" width="280" height="60" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.8"/>
  <text x="560.0" y="55.8" font-size="12" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Un elemento, o null</text>
  <text x="560.0" y="72.6" font-size="12" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Busca por id, sin #</text>
  <rect x="20" y="120" width="330" height="60" rx="8" fill="#f6f8fa" stroke="#5b6876" stroke-width="1.8"/>
  <text x="185.0" y="154.0" font-size="11.5" fill="#16202b" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" style="white-space:pre">document.querySelector(".card")</text>
  <path d="M 350 150 L 418 150" stroke="#0e8f8f" stroke-width="1.6" fill="none" marker-end="url(#fl-teal)"/>
  <rect x="420" y="120" width="280" height="60" rx="8" fill="#eaf6f6" stroke="#0e8f8f" stroke-width="1.8"/>
  <text x="560.0" y="145.8" font-size="12" fill="#0a6666" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">El primer elemento, o null</text>
  <text x="560.0" y="162.6" font-size="12" fill="#0a6666" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Acepta cualquier selector CSS</text>
  <rect x="20" y="210" width="330" height="60" rx="8" fill="#f6f8fa" stroke="#5b6876" stroke-width="1.8"/>
  <text x="185.0" y="244.0" font-size="11.5" fill="#16202b" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" style="white-space:pre">document.querySelectorAll(".card")</text>
  <path d="M 350 240 L 418 240" stroke="#2e7d5b" stroke-width="1.6" fill="none" marker-end="url(#fl-green)"/>
  <rect x="420" y="210" width="280" height="60" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.8"/>
  <text x="560.0" y="235.8" font-size="12" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">NodeList (vacía si no hay)</text>
  <text x="560.0" y="252.6" font-size="12" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Todos los que coinciden</text>
  <text x="360" y="304" font-size="12" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Los tres buscan en el DOM vivo, no en el archivo HTML</text>
</svg>
