<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Si el texto de un usuario contiene una etiqueta img con onerror, innerHTML la interpreta como HTML y ejecuta el código; textContent la muestra como texto literal" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="fl-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="fl-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker></defs>
  <rect x="20" y="125" width="190" height="90" rx="8" fill="#fff8e8" stroke="#b7791f" stroke-width="1.8"/>
  <text x="115.0" y="150.0" font-size="11.5" fill="#6b4a0c" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Lo que escribió</text>
  <text x="115.0" y="166.0" font-size="11.5" fill="#6b4a0c" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">el usuario:</text>
  <text x="115.0" y="182.0" font-size="11.5" fill="#6b4a0c" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" style="white-space:pre">&lt;img src=x</text>
  <text x="115.0" y="198.0" font-size="11.5" fill="#6b4a0c" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" style="white-space:pre">onerror=alert(1)&gt;</text>
  <rect x="340" y="25" width="360" height="110" rx="8" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.8"/>
  <text x="520.0" y="51.8" font-size="11.5" fill="#a32d22" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">innerHTML</text>
  <text x="520.0" y="67.9" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">El navegador interpreta HTML:</text>
  <text x="520.0" y="84.0" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">crea un elemento img</text>
  <text x="520.0" y="100.1" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">la imagen falla y se ejecuta onerror</text>
  <text x="520.0" y="116.2" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">El código del usuario corre en tu página</text>
  <rect x="340" y="205" width="360" height="110" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.8"/>
  <text x="520.0" y="231.8" font-size="11.5" fill="#2e7d5b" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">textContent</text>
  <text x="520.0" y="247.9" font-size="11.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">El navegador lo trata como texto:</text>
  <text x="520.0" y="264.0" font-size="11.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">en pantalla se ve el texto literal</text>
  <text x="520.0" y="280.1" font-size="11.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">no se crea ningún elemento</text>
  <text x="520.0" y="296.2" font-size="11.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Seguro para datos que escribe una persona</text>
  <path d="M 212 150 L 280 80 L 338 80" stroke="#a32d22" stroke-width="1.6" fill="none" marker-end="url(#fl-red)"/>
  <path d="M 212 190 L 280 260 L 338 260" stroke="#2e7d5b" stroke-width="1.6" fill="none" marker-end="url(#fl-green)"/>
</svg>
