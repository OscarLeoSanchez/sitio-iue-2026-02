<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="346" viewBox="0 0 720 346" role="img" aria-label="Del archivo HTML a la pantalla: el parser HTML construye el árbol DOM, el parser CSS construye el CSSOM, ambos se combinan en el árbol de render, luego layout y paint" xmlns="http://www.w3.org/2000/svg">
