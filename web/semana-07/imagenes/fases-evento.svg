<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="Un clic en un botón recorre tres fases: captura de body hacia el botón, objetivo en el botón y burbujeo del botón de vuelta hacia body" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="fl-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="fl-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker></defs>
  <rect x="20" y="20" width="460" height="350" rx="8" fill="#f6f8fa" stroke="#5b6876" stroke-width="1.8"/>
  <text x="250" y="42" font-size="12" fill="#16202b" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-weight="700" style="white-space:pre">body</text>
  <rect x="50" y="60" width="400" height="290" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.8"/>
  <text x="250" y="82" font-size="12" fill="#17456f" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-weight="700" style="white-space:pre">#lista</text>
  <rect x="80" y="100" width="340" height="230" rx="8" fill="#eaf6f6" stroke="#0e8f8f" stroke-width="1.8"/>
  <text x="250" y="122" font-size="12" fill="#0a6666" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-weight="700" style="white-space:pre">.card</text>
  <rect x="150" y="160" width="200" height="60" rx="8" fill="#fff8e8" stroke="#b7791f" stroke-width="2.4"/>
  <text x="250.0" y="185.8" font-size="12" fill="#6b4a0c" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">button  Quitar</text>
  <text x="250.0" y="202.6" font-size="12" fill="#6b4a0c" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">event.target</text>
  <text x="250" y="270" font-size="11.5" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">El clic ocurre aquí</text>
  <text x="250" y="288" font-size="11.5" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">pero el navegador avisa a todos los</text>
  <text x="250" y="304" font-size="11.5" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">ancestros en el camino</text>
  <path d="M 34 40 L 34 345" stroke="#2f7bb8" stroke-width="2.2" fill="none" marker-end="url(#fl-blue)"/>
  <path d="M 466 345 L 466 40" stroke="#2e7d5b" stroke-width="2.2" fill="none" marker-end="url(#fl-green)"/>
  <text x="500" y="60" font-size="13" fill="#17456f" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">1. Captura (bajada)</text>
  <text x="500" y="80" font-size="11.5" fill="#5b6876" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">body, #lista, .card, button</text>
  <text x="500" y="130" font-size="13" fill="#6b4a0c" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">2. Objetivo</text>
  <text x="500" y="150" font-size="11.5" fill="#5b6876" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">el botón es event.target</text>
  <text x="500" y="200" font-size="13" fill="#1d5a40" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">3. Burbujeo (subida)</text>
  <text x="500" y="220" font-size="11.5" fill="#5b6876" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">button, .card, #lista, body</text>
  <text x="500" y="270" font-size="11.5" fill="#16202b" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Por defecto addEventListener</text>
  <text x="500" y="286" font-size="11.5" fill="#16202b" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">escucha en la fase 3</text>
</svg>
