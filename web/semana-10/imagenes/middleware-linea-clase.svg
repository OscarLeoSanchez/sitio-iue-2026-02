<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="394" viewBox="0 0 560 394" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">El mismo middleware en línea y como clase</title>
<desc id="d">Tabla de cinco filas que compara el middleware en línea con el middleware como clase. Dónde vive: Program.cs o la carpeta Middleware. El siguiente paso: el parámetro next o el constructor con RequestDelegate siguiente. Cada petición: el cuerpo de la lambda o el método InvokeAsync. Llamar al siguiente: await next(context) o await siguiente(context). Cómo se registra: app.Use o app.UseMiddleware.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="560" height="394" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<text x="231.0" y="22" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Parte A: en línea</text>
<text x="447.0" y="22" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Parte B: como clase</text>
<rect x="10" y="34" width="112" height="54" rx="6" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.2"/>
<text x="66.0" y="65" font-size="12" fill="#16202b" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Dónde vive</text>
<rect x="130" y="34" width="202" height="54" rx="6" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.2"/>
<text x="231.0" y="65.0" font-size="11.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Program.cs</text>
<rect x="344" y="34" width="206" height="54" rx="6" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.2"/>
<text x="447.0" y="57.0" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Middleware/</text>
<text x="447.0" y="73.0" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Registro...Middleware.cs</text>
<rect x="10" y="96" width="112" height="54" rx="6" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.2"/>
<text x="66.0" y="127" font-size="12" fill="#16202b" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">El siguiente paso</text>
<rect x="130" y="96" width="202" height="54" rx="6" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.2"/>
<text x="231.0" y="127.0" font-size="11.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">parámetro next</text>
<rect x="344" y="96" width="206" height="54" rx="6" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.2"/>
<text x="447.0" y="119.0" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">constructor:</text>
<text x="447.0" y="135.0" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">RequestDelegate siguiente</text>
<rect x="10" y="158" width="112" height="54" rx="6" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.2"/>
<text x="66.0" y="189" font-size="12" fill="#16202b" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Cada petición</text>
<rect x="130" y="158" width="202" height="54" rx="6" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.2"/>
<text x="231.0" y="189.0" font-size="11.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">cuerpo de la lambda</text>
<rect x="344" y="158" width="206" height="54" rx="6" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.2"/>
<text x="447.0" y="181.0" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">método InvokeAsync(</text>
<text x="447.0" y="197.0" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">HttpContext context)</text>
<rect x="10" y="220" width="112" height="54" rx="6" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.2"/>
<text x="66.0" y="251" font-size="12" fill="#16202b" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Llamar al siguiente</text>
<rect x="130" y="220" width="202" height="54" rx="6" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.2"/>
<text x="231.0" y="251.0" font-size="11.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">await next(context);</text>
<rect x="344" y="220" width="206" height="54" rx="6" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.2"/>
<text x="447.0" y="251.0" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">await siguiente(context);</text>
<rect x="10" y="282" width="112" height="54" rx="6" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.2"/>
<text x="66.0" y="313" font-size="12" fill="#16202b" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Cómo se registra</text>
<rect x="130" y="282" width="202" height="54" rx="6" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.2"/>
<text x="231.0" y="313.0" font-size="11.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">app.Use(...)</text>
<rect x="344" y="282" width="206" height="54" rx="6" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.2"/>
<text x="447.0" y="313.0" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">app.UseMiddleware&lt;...&gt;()</text>
<rect x="10" y="346" width="540" height="34" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="280.0" y="367.5" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">En las dos, lo anterior a next corre a la ida y lo posterior, a la vuelta.</text>
</g>
</svg>
