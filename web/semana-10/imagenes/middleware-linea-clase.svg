<?xml version="1.0" encoding="UTF-8"?>
<svg width="660" height="330" viewBox="0 0 660 330" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">El mismo middleware en línea y como clase</title>
<desc id="d">Correspondencia entre el middleware en línea de la etapa 1 y la clase de la etapa 2: el delegado recibe siguiente, la clase lo recibe en el constructor; el cuerpo es el mismo.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker></defs>
<rect x="0" y="0" width="660" height="330" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<text x="170" y="24" font-size="13" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 1: en línea</text>
<text x="490" y="24" font-size="13" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 2: clase</text>
<rect x="10" y="44" width="320" height="48" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="170" y="73" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">app.Use(async (contexto, siguiente) =&gt;</text>
<rect x="350" y="44" width="300" height="48" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="500" y="73" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">InvokeAsync(HttpContext contexto)</text>
<path d="M 333 68 L 347 68" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<rect x="10" y="106" width="320" height="48" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="170" y="135" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">siguiente es un parámetro</text>
<rect x="350" y="106" width="300" height="48" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="500" y="135" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">RegistroPeticionesMiddleware(</text>
<path d="M 333 130 L 347 130" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<rect x="10" y="168" width="320" height="48" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="170" y="197" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">await siguiente();</text>
<rect x="350" y="168" width="300" height="48" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="500" y="197" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">await _siguiente(contexto);</text>
<path d="M 333 192 L 347 192" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<rect x="10" y="230" width="320" height="48" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="170" y="259" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">app.Use(...) en Program.cs</text>
<rect x="350" y="230" width="300" height="48" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="500" y="259" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">app.UseMiddleware&lt;Registro...&gt;();</text>
<path d="M 333 254 L 347 254" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<rect x="10" y="296" width="640" height="28" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="330.0" y="314.5" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">En ambas, lo anterior a la llamada corre a la ida y lo posterior, a la vuelta.</text>
</g>
</svg>
