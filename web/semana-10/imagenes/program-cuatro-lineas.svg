<?xml version="1.0" encoding="UTF-8"?>
<svg width="660" height="300" viewBox="0 0 660 300" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Las cuatro instrucciones de Program.cs</title>
<desc id="d">Program.cs de la plantilla web tiene cuatro instrucciones: CreateBuilder prepara servicios y configuración, Build cierra el registro, MapGet define un endpoint y Run arranca el servidor.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker></defs>
<rect x="0" y="0" width="660" height="300" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="14" width="400" height="56" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="30" y="38" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">var builder = WebApplication.CreateBuilder(args);</text>
<text x="30" y="58" font-size="11.5" fill="#17456f" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Antes de Build</text>
<path d="M 424 42 L 452 42" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="460" y="40" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Prepara configuración,</text>
<text x="460" y="57" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">servicios y Kestrel</text>
<rect x="20" y="84" width="400" height="56" rx="8" fill="#f0f9f9" stroke="#0e8f8f" stroke-width="1.6"/>
<text x="30" y="108" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">var app = builder.Build();</text>
<text x="30" y="128" font-size="11.5" fill="#0a6464" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Build</text>
<path d="M 424 112 L 452 112" fill="none" stroke="#0e8f8f" stroke-width="1.6" marker-end="url(#f-teal)"/>
<text x="460" y="110" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Cierra el registro</text>
<text x="460" y="127" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">de servicios</text>
<rect x="20" y="154" width="400" height="56" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="30" y="178" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">app.MapGet("/", () =&gt; "Hello World!");</text>
<text x="30" y="198" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Después de Build</text>
<path d="M 424 182 L 452 182" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="460" y="180" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Define el pipeline</text>
<text x="460" y="197" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">y los endpoints</text>
<rect x="20" y="224" width="400" height="56" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="30" y="248" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">app.Run();</text>
<text x="30" y="268" font-size="11.5" fill="#8a5a12" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Run</text>
<path d="M 424 252 L 452 252" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-ambar)"/>
<text x="460" y="250" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Arranca el servidor y</text>
<text x="460" y="267" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">espera peticiones</text>
</g>
</svg>
