<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="372" viewBox="0 0 560 372" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">El cortocircuito de /admin</title>
<desc id="d">Dos peticiones. Sin clave: GET /admin/resumen pasa por Registro, llega a la Puerta, que responde 401 y no llama a next; Archivos y Controlador no se alcanzan, y el 401 vuelve por Registro, que lo anota. Con clave=plaza: la Puerta llama a next, Archivos deja pasar, el Controlador responde 200 con el JSON y la respuesta vuelve por todas las piezas.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="560" height="372" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<text x="14" y="24" font-size="13.5" fill="#16202b" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Sin clave: GET /admin/resumen</text>
<rect x="12" y="40" width="112" height="58" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="68.0" y="66.0" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Registro</text>
<text x="68.0" y="84.0" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">mide y anota</text>
<path d="M 126 62 L 152 62" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="154" y="40" width="112" height="58" rx="8" fill="#fbf1f0" stroke="#a32d22" stroke-width="1.6"/>
<text x="210.0" y="66.0" font-size="13.5" fill="#7d1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Puerta</text>
<text x="210.0" y="84.0" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">401: no llama a next</text>
<rect x="296" y="40" width="112" height="58" rx="8" fill="#ffffff" stroke="#8795a3" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="352.0" y="66" font-size="13" fill="#8795a3" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Archivos</text>
<text x="352.0" y="84" font-size="11" fill="#8795a3" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">no se alcanza</text>
<rect x="438" y="40" width="112" height="58" rx="8" fill="#ffffff" stroke="#8795a3" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="494.0" y="66" font-size="13" fill="#8795a3" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Controlador</text>
<text x="494.0" y="84" font-size="11" fill="#8795a3" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">no se alcanza</text>
<path d="M 210.0 100 L 210.0 116 L 68.0 116 L 68.0 100" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-rojo)"/>
<text x="139.0" y="132" font-size="11.5" fill="#7d1f17" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el 401 vuelve y Registro lo anota</text>
<text x="14" y="182" font-size="13.5" fill="#16202b" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Con clave: GET /admin/resumen?clave=plaza</text>
<rect x="12" y="198" width="112" height="58" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="68.0" y="224.0" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Registro</text>
<text x="68.0" y="242.0" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">mide y anota</text>
<path d="M 126 220 L 152 220" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="154" y="198" width="112" height="58" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="210.0" y="224.0" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Puerta</text>
<text x="210.0" y="242.0" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">clave correcta</text>
<path d="M 268 220 L 294 220" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="296" y="198" width="112" height="58" rx="8" fill="#f0f9f9" stroke="#0e8f8f" stroke-width="1.6"/>
<text x="352.0" y="224.0" font-size="13.5" fill="#0a6464" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Archivos</text>
<text x="352.0" y="242.0" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">no es un archivo</text>
<path d="M 410 220 L 436 220" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="438" y="198" width="112" height="58" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="494.0" y="224.0" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Controlador</text>
<text x="494.0" y="242.0" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">responde 200</text>
<path d="M 494.0 258 L 494.0 274 L 68.0 274 L 68.0 258" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="281.0" y="290" font-size="11.5" fill="#1f5c42" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el 200 vuelve por todas las piezas</text>
<rect x="12" y="326" width="536" height="34" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="280.0" y="347.5" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">El cortocircuito es no llamar a next: nada más abajo se ejecuta.</text>
</g>
</svg>
