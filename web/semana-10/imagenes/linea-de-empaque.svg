<title id="t">La petición como un pedido en una línea de empaque</title>
<desc id="d">Metáfora del material: la petición es un pedido que pasa por estaciones (middleware), lo arma el encargado (controlador) con el inventario (modelo) y lo entrega empacado en una caja (vista).</desc>
