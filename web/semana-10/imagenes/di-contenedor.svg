<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="590" viewBox="0 0 560 590" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Cómo se resuelve una dependencia, sin y con inyección</title>
<desc id="d">Panel superior, etapa 8: ProductosController guarda la lista de productos como public static; CatalogoController y PedidosController la leen, y CatalogoController también usa Validar y Guardar de PedidosController. Panel inferior, etapa 9: Program.cs registra en el contenedor que ICatalogo es CatalogoEnMemoria; cuando llega una petición, el controlador pide ICatalogo en su constructor y el contenedor le entrega una CatalogoEnMemoria.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="560" height="590" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="8" y="8" width="544" height="232" rx="10" fill="#ffffff" stroke="#a32d22" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="22" y="32" font-size="13.5" fill="#7d1f17" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 8: los controladores se leen entre sí</text>
<rect x="190" y="48" width="180" height="54" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="280.0" y="72.0" font-size="12.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">ProductosController</text>
<text x="280.0" y="90.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Lista (public static)</text>
<rect x="24" y="156" width="190" height="54" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="119.0" y="188.0" font-size="12.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">CatalogoController</text>
<rect x="346" y="156" width="190" height="54" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="441.0" y="188.0" font-size="12.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">PedidosController</text>
<path d="M 110 156 L 210 104" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-rojo)"/>
<path d="M 450 156 L 350 104" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-rojo)"/>
<path d="M 216 183 L 344 183" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-rojo)"/>
<text x="280" y="176" font-size="11.5" fill="#7d1f17" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">usa Validar y Guardar</text>
<text x="112" y="134" font-size="11.5" fill="#7d1f17" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">lee Lista</text>
<text x="448" y="134" font-size="11.5" fill="#7d1f17" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">lee Lista</text>
<text x="22" y="232" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Cada cambio en uno obliga a revisar a los otros.</text>
<rect x="8" y="256" width="544" height="326" rx="10" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="22" y="280" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 9: piden una interfaz y reciben la clase registrada</text>
<rect x="24" y="296" width="330" height="66" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="189.0" y="320.0" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">1. Al arrancar, Program.cs registra</text>
<text x="189.0" y="337.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">AddSingleton&lt;ICatalogo,</text>
<text x="189.0" y="353.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">CatalogoEnMemoria&gt;();</text>
<path d="M 189 362 L 189 392" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="24" y="392" width="330" height="72" rx="8" fill="#f6f2fa" stroke="#7a4fa0" stroke-width="1.6"/>
<text x="189.0" y="419.0" font-size="13.5" fill="#53307a" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Contenedor de servicios</text>
<text x="189.0" y="436.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">ICatalogo = CatalogoEnMemoria</text>
<text x="189.0" y="452.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">IPedidos = PedidosEnMemoria</text>
<path d="M 130 464 L 130 494" fill="none" stroke="#7a4fa0" stroke-width="1.6" marker-end="url(#f-viol)"/>
<path d="M 250 494 L 250 466" fill="none" stroke="#7a4fa0" stroke-width="1.6" marker-end="url(#f-viol)"/>
<text x="122" y="484" font-size="11.5" fill="#53307a" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">entrega</text>
<text x="258" y="484" font-size="11.5" fill="#53307a" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">pide</text>
<rect x="24" y="494" width="330" height="70" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="189.0" y="520.0" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">2. Llega una petición</text>
<text x="189.0" y="537.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">ProductosController(</text>
<text x="189.0" y="553.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">ICatalogo catalogo)</text>
<text x="376" y="328" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Se ejecuta una sola vez,</text>
<text x="376" y="344" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">al encender el servidor.</text>
<text x="376" y="428" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">El contenedor construye</text>
<text x="376" y="444" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">la clase y la entrega.</text>
<text x="376" y="524" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">El controlador nunca</text>
<text x="376" y="540" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">escribe new.</text>
</g>
</svg>
