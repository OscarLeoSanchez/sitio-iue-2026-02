<rect x="10" y="176" width="640" height="100" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="24" y="198" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">1. Al arrancar, Program.cs registra qué clase cumple cada interfaz.</text>
<text x="24" y="220" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">2. Llega una petición y MVC crea el controlador: su constructor pide ICatalogoService.</text>
<text x="24" y="242" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">3. El contenedor entrega una CatalogoEnMemoria. El controlador nunca escribe new.</text>
<text x="24" y="264" font-size="12" fill="#7a1f17" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Sin registro: Unable to resolve service for type '...ICatalogoService' (500).</text>
<rect x="10" y="296" width="640" height="30" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="330.0" y="315.5" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Esa línea de error sale solo en la petición que usa ese controlador.</text>
</g>
</svg>
