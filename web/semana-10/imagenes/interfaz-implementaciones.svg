<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="380" viewBox="0 0 560 380" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Una interfaz, dos implementaciones</title>
<desc id="d">Los controladores conocen solo la interfaz ICatalogo, que tiene los métodos Listar, Buscar y Existe. Dos clases la implementan: CatalogoEnMemoria con los precios normales y CatalogoConOferta con 10 por ciento de descuento. Program.cs elige cuál se registra, cambiando una sola línea.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="560" height="380" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="130" y="10" width="300" height="50" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="280.0" y="32.0" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Controladores</text>
<text x="280.0" y="50.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">conocen solo ICatalogo</text>
<path d="M 280 60 L 280 82" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<rect x="130" y="82" width="300" height="92" rx="8" fill="#f6f2fa" stroke="#7a4fa0" stroke-width="1.6"/>
<text x="280" y="104" font-size="13.5" fill="#53307a" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">interface ICatalogo</text>
<text x="280" y="128" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Listar()</text>
<text x="280" y="146" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Buscar(int id)</text>
<text x="280" y="164" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Existe(string nombre)</text>
<path d="M 190 176 L 130 222" fill="none" stroke="#7a4fa0" stroke-width="1.6" marker-end="url(#f-viol)"/>
<path d="M 370 176 L 430 222" fill="none" stroke="#7a4fa0" stroke-width="1.6" marker-end="url(#f-viol)"/>
<text x="130" y="202" font-size="11.5" fill="#53307a" font-weight="400" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">implementa</text>
<text x="430" y="202" font-size="11.5" fill="#53307a" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">implementa</text>
<rect x="14" y="224" width="250" height="64" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="139.0" y="253.0" font-size="13" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">CatalogoEnMemoria</text>
<text x="139.0" y="271.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">precios normales</text>
<rect x="296" y="224" width="250" height="64" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="421.0" y="253.0" font-size="13" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">CatalogoConOferta</text>
<text x="421.0" y="271.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">10 % de descuento</text>
<rect x="14" y="308" width="532" height="58" rx="8" fill="#ffffff" stroke="#2f7bb8" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="280" y="330" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Program.cs decide cuál se entrega. Esta es la única línea que cambia:</text>
<text x="280" y="352" font-size="12.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">AddSingleton&lt;ICatalogo, CatalogoEnMemoria&gt;();</text>
</g>
</svg>
