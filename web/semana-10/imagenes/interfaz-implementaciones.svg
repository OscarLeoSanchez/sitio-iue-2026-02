<text x="531.0" y="236" font-size="12.5" fill="#3a4652" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Otra implementación</text>
<text x="531.0" y="256" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">mismo contrato</text>
<rect x="20" y="302" width="600" height="26" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="320.0" y="319.5" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Si el contrato no cambia, el controlador no se entera de qué clase hay detrás.</text>
