<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Cliente y servidor en el mismo computador</title>
<desc id="d">Un navegador envia GET /Catalogo a MercadoCampesinoWeb, un servidor que corre en localhost puerto 5190, y recibe una respuesta 200 con HTML.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker></defs>
<rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="40" width="190" height="120" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="115.0" y="62" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Navegador</text>
<text x="115.0" y="82" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el cliente</text>
<text x="115.0" y="99" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">pide una ruta</text>
<text x="115.0" y="116" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">y muestra la respuesta</text>
<rect x="430" y="40" width="190" height="120" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="525.0" y="62" font-size="13" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">MercadoCampesinoWeb</text>
<text x="525.0" y="82" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">tu programa en C#</text>
<text x="525.0" y="99" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Kestrel escucha en</text>
<text x="525.0" y="116" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">localhost:5190</text>
<text x="320" y="26" font-size="12" fill="#5b6876" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">tu computador</text>
<path d="M 214 85 L 426 85" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="320" y="76" font-size="12" fill="#17456f" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">1. Petición: GET /Catalogo</text>
<path d="M 426 130 L 214 130" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="320" y="152" font-size="12" fill="#1f5c42" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">2. Respuesta: 200 y HTML</text>
<rect x="20" y="190" width="600" height="34" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="320.0" y="211.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">localhost es este mismo equipo. El cliente siempre habla primero.</text>
</g>
</svg>
