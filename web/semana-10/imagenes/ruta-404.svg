<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Dos caminos llevan al mismo 404</title>
<desc id="d">Una petición sin ruta que coincida da 404. Si la ruta coincide pero la acción no encuentra el producto, responde NotFound y también da 404. Las dos respuestas se ven iguales.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker></defs>
<rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="20" width="150" height="50" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="95.0" y="42" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Petición</text>
<rect x="230" y="20" width="180" height="50" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="320.0" y="42" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">¿Coincide una ruta?</text>
<path d="M 172 45 L 228 45" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 412 45 L 468 45" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-rojo)"/>
<text x="440" y="36" font-size="11.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">no</text>
<rect x="470" y="20" width="150" height="50" rx="8" fill="#fdf3f1" stroke="#a32d22" stroke-width="1.6"/>
<text x="545.0" y="42" font-size="13" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">404</text>
<text x="545.0" y="62" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">sin acción</text>
<path d="M 320 72 L 320 112" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="328" y="96" font-size="11.5" fill="#17456f" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">sí</text>
<rect x="230" y="114" width="180" height="50" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="320.0" y="136" font-size="12.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Acción Detalle(id)</text>
<path d="M 320 166 L 320 200" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="230" y="202" width="180" height="50" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="320.0" y="224" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">¿Existe el producto?</text>
<path d="M 412 227 L 468 227" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-rojo)"/>
<text x="440" y="218" font-size="11.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">no</text>
<rect x="470" y="202" width="150" height="50" rx="8" fill="#fdf3f1" stroke="#a32d22" stroke-width="1.6"/>
<text x="545.0" y="224" font-size="13" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">404</text>
<text x="545.0" y="244" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">NotFound()</text>
<path d="M 228 227 L 172 227" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="200" y="218" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">sí</text>
<rect x="20" y="202" width="150" height="50" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="95.0" y="224" font-size="13" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">200</text>
<text x="95.0" y="244" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">devuelve la vista</text>
<text x="470" y="90" font-size="11" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">ejemplo: /Otro</text>
<text x="430" y="272" font-size="11" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">ejemplo: /Catalogo/Detalle/999</text>
<rect x="20" y="290" width="600" height="32" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="320.0" y="310.5" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">/Catalogo/Detalle/abc y /Catalogo/Detalle llegan con id = 0: también 404.</text>
</g>
</svg>
