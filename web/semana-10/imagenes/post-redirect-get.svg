<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Post/Redirect/Get</title>
<desc id="d">Secuencia entre el navegador y el servidor. 1: el navegador envía POST /pedidos/formulario. El servidor guarda el pedido. 2: responde 302 con Location /pedidos.html. 3: el navegador pide GET /pedidos.html. 4: el servidor responde 200 con la página. 5: la página pide GET /api/pedidos. 6: el servidor responde 200 con el JSON. Recargar repite el último GET y no vuelve a enviar el pedido.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="560" height="420" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="40" y="12" width="140" height="36" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="110.0" y="35.0" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Navegador</text>
<rect x="380" y="12" width="140" height="36" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="450.0" y="35.0" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Servidor</text>
<path d="M 110 50 L 110 366" fill="none" stroke="#8795a3" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 450 50 L 450 366" fill="none" stroke="#8795a3" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 113 84 L 447 84" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="280" y="64" font-size="12.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">1. POST /pedidos/formulario</text>
<text x="280" y="78" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">cuerpo: cliente=Ana&amp;producto=Tomate&amp;cantidad=2</text>
<rect x="458" y="96" width="98" height="28" rx="5" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.2"/>
<text x="507" y="114" font-size="11" fill="#1f5c42" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">guarda el pedido</text>
<path d="M 447 158 L 113 158" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-ambar)"/>
<text x="280" y="138" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">2. 302 Found</text>
<text x="280" y="152" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Location: /pedidos.html</text>
<path d="M 113 222 L 447 222" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="280" y="202" font-size="12.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">3. GET /pedidos.html</text>
<text x="280" y="216" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el navegador sigue la dirección nueva</text>
<path d="M 447 268 L 113 268" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="280" y="248" font-size="12.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">4. 200 OK</text>
<text x="280" y="262" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">la página pedidos.html</text>
<path d="M 113 314 L 447 314" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="280" y="294" font-size="12.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">5. GET /api/pedidos</text>
<text x="280" y="308" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">lo pide el JavaScript de la página</text>
<path d="M 447 360 L 113 360" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="280" y="340" font-size="12.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">6. 200 OK</text>
<text x="280" y="354" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el JSON con los pedidos</text>
<rect x="14" y="380" width="532" height="30" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="280.0" y="399.5" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Recargar repite el último GET: el pedido no se vuelve a enviar.</text>
</g>
</svg>
