<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="380" viewBox="0 0 640 380" role="img" aria-label="Modelo de caja CSS: contenido en el centro, rodeado de padding, luego el borde, y por fuera el margen" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="m1-sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#m1-sombra)">
      <rect x="30" y="30" width="580" height="320" rx="10" fill="#fdf7ec" stroke="#c9a24a" stroke-width="1.5"/>
    </g>
    <text x="88" y="55" font-size="12" font-weight="700" fill="#8a651e">margen</text>

    <rect x="80" y="72" width="480" height="248" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
    <text x="138" y="94" font-size="12" font-weight="700" fill="#a32d22">borde</text>

    <rect x="120" y="110" width="400" height="180" rx="6" fill="#eef2f6" stroke="#5b6876" stroke-width="1.3"/>
    <text x="178" y="130" font-size="12" font-weight="700" fill="#5b6876">padding</text>

    <g filter="url(#m1-sombra)">
      <rect x="180" y="150" width="280" height="110" rx="6" fill="#ffffff" stroke="#2f7bb8" stroke-width="2"/>
    </g>
    <text x="320" y="200" font-size="13.5" font-weight="700" fill="#17456f">contenido</text>
    <text x="320" y="222" font-size="11" fill="#5b6876">width / height</text>
  </g>
</svg>
