<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Estrategia mobile-first: el CSS base esta pensado para telefono, y cada media query con min-width agrega complejidad para pantallas mas anchas, de telefono a tablet y de tablet a escritorio" xmlns="http://www.w3.org/2000/svg">
  <defs>
