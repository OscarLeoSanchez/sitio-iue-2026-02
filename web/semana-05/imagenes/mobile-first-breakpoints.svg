    <text x="85" y="240" font-size="12" font-weight="700" fill="#17456f">Telefono</text>
    <text x="85" y="272" font-size="10.5" fill="#5b6876">CSS base, sin</text>
    <text x="85" y="286" font-size="10.5" fill="#5b6876">media query</text>

    <g filter="url(#b1-sombra)">
      <rect x="270" y="65" width="150" height="185" rx="10" fill="#ffffff" stroke="#0e8f8f" stroke-width="2"/>
    </g>
    <rect x="285" y="81" width="120" height="14" rx="2" fill="#0e8f8f"/>
    <rect x="285" y="102" width="56" height="60" rx="4" fill="#f6f8fa" stroke="#cfd8e3"/>
    <rect x="349" y="102" width="56" height="60" rx="4" fill="#f6f8fa" stroke="#cfd8e3"/>
    <text x="345" y="240" font-size="12" font-weight="700" fill="#0e8f8f">Tablet</text>
    <text x="345" y="266" font-size="10.5" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">min-width: 768px</text>

    <g filter="url(#b1-sombra)">
