    <text x="615" y="240" font-size="12" font-weight="700" fill="#8a651e">Escritorio</text>
    <text x="615" y="266" font-size="10.5" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">min-width: 1024px</text>

    <line x1="140" y1="170" x2="255" y2="150" stroke="#17456f" stroke-width="2" marker-end="url(#b1-punta)"/>
