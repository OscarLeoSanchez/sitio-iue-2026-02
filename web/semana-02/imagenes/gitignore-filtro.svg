<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="El gitignore filtra: las paginas y el README van al repositorio, mientras node_modules, bin y los archivos con claves se quedan en tu maquina" xmlns="http://www.w3.org/2000/svg">
  <defs>
