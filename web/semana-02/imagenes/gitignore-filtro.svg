  <text x="536" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6876">Se queda en tu máquina</text>
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" fill="#5b6876">
    <text x="536" y="244">node_modules/   bin/</text>
