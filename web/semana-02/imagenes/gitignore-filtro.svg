  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" fill="#16202b">
    <text x="536" y="104">index.html</text>
    <text x="536" y="128">styles.css</text>
    <text x="536" y="152">README.md</text>
  </g>
