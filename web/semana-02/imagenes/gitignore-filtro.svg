      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <marker id="gf-punta-verde" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2e7d5b"/>
    </marker>
  </defs>
  <text x="150" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" letter-spacing="1.2" fill="#5b6876">EN TU CARPETA</text>
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13">
    <rect x="30" y="46" width="240" height="34" rx="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="48" y="68" fill="#16202b">index.html</text>
    <rect x="30" y="88" width="240" height="34" rx="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="48" y="110" fill="#16202b">styles.css</text>
    <rect x="30" y="130" width="240" height="34" rx="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="48" y="152" fill="#16202b">README.md</text>
    <rect x="30" y="172" width="240" height="34" rx="6" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="48" y="194" fill="#5b6876">node_modules/</text>
    <rect x="30" y="214" width="240" height="34" rx="6" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="48" y="236" fill="#5b6876">bin/</text>
    <rect x="30" y="256" width="240" height="34" rx="6" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="48" y="278" fill="#5b6876">appsettings.json</text>
