  <rect x="352" y="46" width="88" height="244" rx="12" fill="#e8f6f3" stroke="#0e8f8f" stroke-width="2"/>
  <text transform="rotate(-90 396 168)" x="396" y="168" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#0e8f8f">.gitignore</text>
  <line x1="284" y1="168" x2="344" y2="168" stroke="#5b6876" stroke-width="2.5" marker-end="url(#gf-punta)"/>
  <line x1="448" y1="108" x2="506" y2="108" stroke="#2e7d5b" stroke-width="2.5" marker-end="url(#gf-punta-verde)"/>
  <line x1="448" y1="238" x2="506" y2="238" stroke="#5b6876" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#gf-punta)"/>
  <rect x="514" y="46" width="356" height="126" rx="10" fill="#f2faf6" stroke="#a9d6bd" stroke-width="1.8"/>
