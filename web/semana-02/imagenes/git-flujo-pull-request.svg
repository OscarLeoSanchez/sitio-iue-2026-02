<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Flujo de trabajo en dos carriles: en tu computador creas la rama, haces commits y publicas; en GitHub abres el Pull Request, el equipo revisa y fusiona; despues bajas el resultado con git pull" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="d5-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#17456f"/>
    </marker>
    <filter id="d5-sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect x="0" y="48" width="760" height="100" rx="10" fill="#f2f6fa"/>
  <rect x="0" y="176" width="760" height="100" rx="10" fill="#ecf6f5"/>
  <text x="8" y="40" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="1.4" fill="#5b6876">EN TU COMPUTADOR</text>
  <text x="8" y="292" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="1.4" fill="#5b6876">EN GITHUB</text>
  <g fill="none" stroke="#17456f" stroke-width="2" marker-end="url(#d5-punta)">
    <line x1="114" y1="98" x2="136" y2="98"/>
    <line x1="242" y1="98" x2="264" y2="98"/>
    <path d="M 318,131 C 318,166 446,158 446,191"/>
    <line x1="498" y1="226" x2="520" y2="226"/>
    <path d="M 574,193 C 574,158 702,166 702,133"/>
  </g>
  <g filter="url(#d5-sombra)">
    <rect x="12" y="67" width="100" height="62" rx="8" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <rect x="140" y="67" width="100" height="62" rx="8" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <rect x="268" y="67" width="100" height="62" rx="8" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <rect x="396" y="195" width="100" height="62" rx="8" fill="#ffffff" stroke="#a8d5d2" stroke-width="1.5"/>
    <rect x="524" y="195" width="100" height="62" rx="8" fill="#ffffff" stroke="#a8d5d2" stroke-width="1.5"/>
    <rect x="652" y="67" width="100" height="62" rx="8" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
  </g>
  <g fill="#17456f">
    <circle cx="25" cy="80" r="10"/>
    <circle cx="153" cy="80" r="10"/>
    <circle cx="281" cy="80" r="10"/>
    <circle cx="409" cy="208" r="10"/>
    <circle cx="537" cy="208" r="10"/>
    <circle cx="665" cy="80" r="10"/>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="25" y="84">1</text>
    <text x="153" y="84">2</text>
    <text x="281" y="84">3</text>
    <text x="409" y="212">4</text>
    <text x="537" y="212">5</text>
    <text x="665" y="84">6</text>
  </g>
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#17456f" text-anchor="middle">
    <text x="62" y="106">git switch -c</text>
    <text x="62" y="121">feature/menu</text>
    <text x="190" y="106">git commit</text>
    <text x="318" y="106">git push</text>
    <text x="702" y="106">git pull</text>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6876" text-anchor="middle">
    <text x="190" y="121">una o varias veces</text>
    <text x="318" y="121">publica la rama</text>
    <text x="446" y="234">Abres el</text>
    <text x="446" y="248">Pull Request</text>
    <text x="574" y="234">Tu equipo revisa</text>
    <text x="574" y="248">y fusiona</text>
    <text x="702" y="121">main actualizada</text>
  </g>
