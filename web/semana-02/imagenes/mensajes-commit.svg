  </g>
  <rect x="450" y="30" width="400" height="240" rx="12" fill="#f2faf6" stroke="#a9d6bd" stroke-width="1.8"/>
  <text x="476" y="70" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#2e7d5b">Así sí</text>
  <g stroke="#2e7d5b" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M478,116 l7,7 l13,-14"/>
    <path d="M478,154 l7,7 l13,-14"/>
    <path d="M478,192 l7,7 l13,-14"/>
    <path d="M478,230 l7,7 l13,-14"/>
  </g>
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13.5" fill="#16202b">
