<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Comparacion de mensajes de commit: los vagos como cambios o asdf frente a los que describen el cambio con un prefijo de tipo" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="30" width="330" height="240" rx="12" fill="#fdf3f2" stroke="#e3b7b0" stroke-width="1.8"/>
