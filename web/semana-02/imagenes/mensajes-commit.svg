  <g stroke="#c0392b" stroke-width="2.2" fill="none">
    <path d="M78,110 l12,12 M90,110 l-12,12"/>
    <path d="M78,148 l12,12 M90,148 l-12,12"/>
    <path d="M78,186 l12,12 M90,186 l-12,12"/>
    <path d="M78,224 l12,12 M90,224 l-12,12"/>
  </g>
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#5b6876">
    <text x="110" y="121">cambios</text>
    <text x="110" y="159">arreglos</text>
    <text x="110" y="197">asdf</text>
