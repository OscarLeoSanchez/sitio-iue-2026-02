<?xml version="1.0" encoding="UTF-8"?>
<svg width="740" height="380" viewBox="0 0 740 380" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Del issue al pull request</title>
<desc id="d">Cinco pasos. El ingeniero escribe un issue con el problema y los criterios. Lo asigna a Copilot, Codex o Claude mediante @claude. El agente en la nube trabaja en su propia rama y ejecuta pruebas. Abre un pull request en borrador. Las pruebas y la integración continua verifican antes de que el ingeniero revise el diff, pida cambios y decida. Los comentarios de revisión vuelven al agente. Una advertencia dice que el issue es una entrada no confiable. Abajo, Symphony de OpenAI, en vista previa.</desc>
