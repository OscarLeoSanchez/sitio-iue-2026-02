<?xml version="1.0" encoding="UTF-8"?>
<svg width="740" height="400" viewBox="0 0 740 400" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">La lethal trifecta y la regla de dos</title>
<desc id="d">Tres cajas de riesgo: datos privados, contenido no confiable y canal de salida. Las tres apuntan a una caja central: si el agente reúne las tres, un atacante puede dirigirlo para que envíe los datos privados. Abajo, dos cajas del ingeniero: la regla de dos de Meta, que permite como máximo dos de tres propiedades por sesión, y las decisiones de quitar una de las tres patas o pedir aprobación humana.</desc>
<defs><marker id="f-cielo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-hoja" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-maiz" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-tomate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-uva" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f2540" flood-opacity="0.13"/></filter></defs>
<rect x="0" y="0" width="740" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="20" width="210" height="100" rx="8" fill="#fdf3f1" stroke="#a32d22" stroke-width="1.6" filter="url(#sombra)"/>
<text x="125.0" y="43" font-size="13.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Datos privados</text>
<text x="125.0" y="65" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">código, secretos,</text>
<text x="125.0" y="83" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">bases de datos, correos</text>
<rect x="265" y="20" width="210" height="100" rx="8" fill="#fdf3f1" stroke="#a32d22" stroke-width="1.6" filter="url(#sombra)"/>
<text x="370.0" y="43" font-size="13.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Contenido no confiable</text>
<text x="370.0" y="65" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">issues, comentarios, páginas</text>
<text x="370.0" y="83" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">web y documentos de terceros</text>
<rect x="510" y="20" width="210" height="100" rx="8" fill="#fdf3f1" stroke="#a32d22" stroke-width="1.6" filter="url(#sombra)"/>
<text x="615.0" y="43" font-size="13.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Canal de salida</text>
<text x="615.0" y="65" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">peticiones web, correos,</text>
<text x="615.0" y="83" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">comentarios o commits</text>
<path d="M 125 122 L 260 168" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-tomate)"/>
<path d="M 370 122 L 370 168" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-tomate)"/>
<path d="M 615 122 L 480 168" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-tomate)"/>
<rect x="190" y="172" width="360" height="78" rx="8" fill="#fbe4e0" stroke="#a32d22" stroke-width="1.6" filter="url(#sombra)"/>
<text x="370.0" y="195" font-size="13.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Fuga de datos</text>
<text x="370.0" y="217" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">si el agente reúne las tres, un atacante puede</text>
<text x="370.0" y="235" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">dirigirlo para que envíe los datos privados</text>
<text x="370" y="278" font-size="11.5" fill="#5b6876" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">cómo cortar el riesgo</text>
<rect x="20" y="290" width="340" height="94" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="190.0" y="313" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Regla de dos (Meta)</text>
<text x="190.0" y="335" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">en una sesión, como máximo dos de tres:</text>
<text x="190.0" y="353" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">entradas no confiables, datos sensibles,</text>
<text x="190.0" y="371" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">cambiar estado o comunicar hacia fuera</text>
<rect x="380" y="290" width="340" height="94" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="550.0" y="313" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Qué decide el ingeniero</text>
<text x="550.0" y="335" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">quitar una pata: sin datos privados,</text>
<text x="550.0" y="353" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">sin contenido externo o sin canal de salida;</text>
<text x="550.0" y="371" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">si hacen falta las tres, una persona aprueba</text>
</g>
</svg>
