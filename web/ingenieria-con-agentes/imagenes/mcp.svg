<rect x="20" y="304" width="340" height="70" rx="8" fill="#fdf3f1" stroke="#a32d22" stroke-width="1.6" filter="url(#sombra)"/>
<text x="190.0" y="327" font-size="13.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Riesgo: permisos</text>
<text x="190.0" y="349" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">cada servidor amplía lo que el agente</text>
<text x="190.0" y="367" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">puede leer o cambiar</text>
<rect x="390" y="304" width="330" height="70" rx="8" fill="#f7f3fa" stroke="#7a4fa0" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sombra)"/>
<text x="555.0" y="327" font-size="13.5" fill="#52307a" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">MCP Apps (extensión oficial)</text>
<text x="555.0" y="349" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">un servidor entrega una interfaz ui://</text>
<text x="555.0" y="367" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">en HTML dentro de un iframe aislado</text>
