<text x="674" y="425" font-size="11.5" fill="#7a1f17" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">293.397</text>
<text x="20" y="472" font-size="11" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Una sola corrida por metodología: son observaciones de este caso, no un ranking. Plan mode suma plan y código.</text>
