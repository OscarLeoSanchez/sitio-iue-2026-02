<text x="170" y="300" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">8 pruebas nuevas, 7 en rojo;</text>
<text x="170" y="317" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">13 líneas de producción.</text>
<rect x="480" y="292" width="77" height="24" rx="3" fill="#e9b3ab" stroke="#a32d22" stroke-width="1.2"/>
<text x="563" y="309" font-size="11.5" fill="#7a1f17" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">120.777</text>
<rect x="12" y="336" width="716" height="52" rx="6" fill="#ffffff" stroke="#e1e6eb" stroke-width="1"/>
<text x="24" y="367" font-size="13" fill="#17456f" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Ciclo autónomo</text>
<text x="170" y="358" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">2 vueltas y un barrido de</text>
