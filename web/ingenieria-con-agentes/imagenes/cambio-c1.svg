<?xml version="1.0" encoding="UTF-8"?>
<svg width="740" height="490" viewBox="0 0 740 490" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Cómo absorbió cada metodología el cambio C1</title>
<desc id="d">Siete filas, una por metodología, con lo que hizo ante el cambio C1 (el descuento del 10 por ciento solo sobre productos orgánicos) y una barra con los tokens que gastó. Vibe coding: 2 archivos y un commit, sin ejecutar el cálculo, 92.216 tokens. Plan mode: un plan nuevo y 5 líneas en 2 archivos, 196.119 tokens entre plan y código. SDD: 7 documentos y luego 2 archivos de código, 160.161 tokens. ODD: reescribió una especificación y reabrió una tarea, con 4 pruebas nuevas, 112.023 tokens. TDD: 8 pruebas nuevas, 7 en rojo, 120.777 tokens. Ciclo autónomo: 2 vueltas y un barrido de 499 combinaciones, 123.453 tokens. Compound engineering: un plan nuevo de 177 líneas y sin aprendizaje nuevo, 293.397 tokens.</desc>
