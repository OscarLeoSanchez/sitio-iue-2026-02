<svg width="740" height="380" viewBox="0 0 740 380" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">La línea de tiempo del vocabulario</title>
<desc id="d">Una línea de tiempo con seis estaciones y su estado. Prompt, de 2023 a 2024, consolidado. Context, de junio a septiembre de 2025, consolidado. Harness, de noviembre de 2025 a febrero de 2026, emergente. Loop, junio y julio de 2026, emergente. Graph, julio y agosto de 2026, emergente a experimental. Meta-harness y autoevolución, en 2026, experimental. Una franja dice que lo que permanece es especificar, dar contexto y verificar.</desc>
