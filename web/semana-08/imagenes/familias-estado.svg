<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="Familias de códigos de estado HTTP: 2xx éxito, 3xx redirección, 4xx error del cliente, 5xx error del servidor" xmlns="http://www.w3.org/2000/svg">
