<rect x="557" y="224" width="141" height="50" rx="6" fill="#ffffff" stroke="#a32d22" stroke-width="1.2"/>
<text x="627" y="246" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Quien responde falló</text>
<text x="360" y="322" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Ante un 4xx, reintentar casi nunca ayuda. Ante un 5xx, a veces sí.</text>
