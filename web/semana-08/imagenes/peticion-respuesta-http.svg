<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Mensaje HTTP: una petición y una respuesta, cada una con línea inicial, encabezados y cuerpo" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="24" width="330" height="340" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="185" y="50" font-size="15" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Petición (cliente)</text>
<rect x="34" y="68" width="302" height="40" rx="6" fill="#ffffff" stroke="#2f7bb8" stroke-width="1.2"/>
<text x="44" y="89" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">GET /products?limit=3 HTTP/1.1</text>
<text x="330" y="101" font-size="10" fill="#17456f" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">línea inicial</text>
<rect x="34" y="118" width="302" height="58" rx="6" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.2"/>
<text x="44" y="139" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Host: dummyjson.com</text>
<text x="44" y="156" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Accept: application/json</text>
<text x="330" y="169" font-size="10" fill="#0b6e6e" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">encabezados</text>
<rect x="34" y="186" width="302" height="40" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="44" y="207" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">(vacío: un GET no lleva cuerpo)</text>
<text x="330" y="219" font-size="10" fill="#8a5a12" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">cuerpo</text>
<rect x="370" y="24" width="330" height="340" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="535" y="50" font-size="15" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Respuesta (servidor)</text>
<rect x="384" y="68" width="302" height="40" rx="6" fill="#ffffff" stroke="#2f7bb8" stroke-width="1.2"/>
<text x="394" y="89" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">HTTP/1.1 200 OK</text>
<text x="680" y="101" font-size="10" fill="#17456f" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">línea de estado</text>
<rect x="384" y="118" width="302" height="58" rx="6" fill="#ffffff" stroke="#0e8f8f" stroke-width="1.2"/>
<text x="394" y="139" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Content-Type: application/json</text>
<text x="394" y="156" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Content-Length: 312</text>
<text x="680" y="169" font-size="10" fill="#0b6e6e" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">encabezados</text>
<rect x="384" y="186" width="302" height="76" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="394" y="207" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">{"products":[{"id":1,</text>
<text x="394" y="224" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve"> "title":"Essence Mascara..."}],</text>
<text x="394" y="241" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve"> "total":194}</text>
<text x="680" y="255" font-size="10" fill="#8a5a12" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">cuerpo</text>
<text x="360" y="386" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Una línea en blanco separa los encabezados del cuerpo.</text>
</g>
</svg>
