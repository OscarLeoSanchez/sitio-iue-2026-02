<text x="627" y="238" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Hoy: solo lo conoces</text>
<text x="360" y="292" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">El método comunica la intención. Quien decide qué hacer con ella es el servidor.</text>
<text x="360" y="312" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Esta semana: GET para leer el catálogo y POST para publicar un producto.</text>
