<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="fetch devuelve dos promesas en secuencia: la primera entrega el objeto Response con estado y encabezados, la segunda el cuerpo ya convertido" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<text x="20" y="30" font-size="11" fill="#5b6876" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">tiempo</text>
<path d="M 60 26 L 700 26" fill="none" stroke="#8795a3" stroke-width="1.2" marker-end="url(#f-gris)"/>
<rect x="20" y="52" width="200" height="96" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="120" y="76" font-size="14" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">fetch(url)</text>
<text x="120" y="98" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Devuelve la promesa 1</text>
<text x="120" y="113" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">(pendiente mientras</text>
<text x="120" y="128" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">llegan los encabezados)</text>
<rect x="260" y="52" width="200" height="96" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="360" y="76" font-size="14" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Response</text>
<text x="360" y="98" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Promesa 1 cumplida.</text>
<text x="360" y="113" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Ya tienes status, ok y</text>
<text x="360" y="128" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">headers. El cuerpo no.</text>
<rect x="500" y="52" width="200" height="96" rx="8" fill="#f0f9f9" stroke="#0e8f8f" stroke-width="1.6"/>
<text x="600" y="76" font-size="13" fill="#0b6e6e" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">response.json()</text>
<text x="600" y="98" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Devuelve la promesa 2</text>
<text x="600" y="113" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">(el cuerpo se descarga</text>
<text x="600" y="128" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">y se interpreta)</text>
<path d="M 222 100 L 256 100" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<path d="M 462 100 L 496 100" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<rect x="500" y="190" width="200" height="76" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="600" y="214" font-size="13" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Objeto JavaScript</text>
<text x="600" y="236" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Promesa 2 cumplida.</text>
<text x="600" y="251" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Listo para usar.</text>
<path d="M 600 150 L 600 186" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<rect x="20" y="190" width="440" height="76" rx="8" fill="#ffffff" stroke="#a32d22" stroke-width="1.6"/>
<text x="240" y="214" font-size="13" fill="#a32d22" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Dónde puede fallar cada una</text>
<text x="34" y="236" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Promesa 1 rechaza: no hubo respuesta (sin red, CORS, DNS).</text>
<text x="34" y="253" font-size="11" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Promesa 2 rechaza: el cuerpo no es JSON válido.</text>
<rect x="20" y="290" width="680" height="50" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="360" y="320" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Por eso hay dos await: uno para la respuesta y otro para el cuerpo.</text>
</g>
</svg>
