<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Comparacion de puntos de quiebre: Bootstrap usa sm md lg xl xxl con prefijo antes de la propiedad, Tailwind usa sm md lg xl 2xl como prefijo de la clase" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bp-sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#bp-sombra)">
      <rect x="30" y="30" width="660" height="120" rx="10" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
    </g>
    <text x="60" y="55" font-size="13" font-weight="700" fill="#17456f" text-anchor="start">Bootstrap</text>
    <g font-size="10.5" fill="#17456f">
      <rect x="60" y="70" width="110" height="34" rx="6" fill="#ffffff" stroke="#2f7bb8"/>
      <text x="115" y="91">sm, 576px</text>
      <rect x="185" y="70" width="110" height="34" rx="6" fill="#ffffff" stroke="#2f7bb8"/>
      <text x="240" y="91">md, 768px</text>
      <rect x="310" y="70" width="110" height="34" rx="6" fill="#ffffff" stroke="#2f7bb8"/>
      <text x="365" y="91">lg, 992px</text>
      <rect x="435" y="70" width="110" height="34" rx="6" fill="#ffffff" stroke="#2f7bb8"/>
      <text x="490" y="91">xl, 1200px</text>
      <rect x="560" y="70" width="110" height="34" rx="6" fill="#ffffff" stroke="#2f7bb8"/>
      <text x="615" y="91">xxl, 1400px</text>
    </g>
    <text x="360" y="122" font-size="10.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace">col-md-6, d-lg-flex</text>

    <g filter="url(#bp-sombra)">
      <rect x="30" y="170" width="660" height="120" rx="10" fill="#f4faf7" stroke="#0e8f8f" stroke-width="1.6"/>
    </g>
    <text x="60" y="195" font-size="13" font-weight="700" fill="#0e8f8f" text-anchor="start">Tailwind</text>
    <g font-size="10.5" fill="#0e8f8f">
      <rect x="60" y="210" width="110" height="34" rx="6" fill="#ffffff" stroke="#0e8f8f"/>
      <text x="115" y="231">sm, 640px</text>
      <rect x="185" y="210" width="110" height="34" rx="6" fill="#ffffff" stroke="#0e8f8f"/>
      <text x="240" y="231">md, 768px</text>
      <rect x="310" y="210" width="110" height="34" rx="6" fill="#ffffff" stroke="#0e8f8f"/>
      <text x="365" y="231">lg, 1024px</text>
      <rect x="435" y="210" width="110" height="34" rx="6" fill="#ffffff" stroke="#0e8f8f"/>
      <text x="490" y="231">xl, 1280px</text>
      <rect x="560" y="210" width="110" height="34" rx="6" fill="#ffffff" stroke="#0e8f8f"/>
      <text x="615" y="231">2xl, 1536px</text>
    </g>
    <text x="360" y="262" font-size="10.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace">md:grid-cols-2, lg:flex</text>
  </g>
</svg>
