<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="El mismo boton escrito de tres formas: HTML puro con CSS aparte, Bootstrap con la clase btn btn-primary, y Tailwind con utilidades combinadas" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bt-sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#bt-sombra)">
      <rect x="20" y="30" width="230" height="240" rx="10" fill="#f6f8fa" stroke="#5b6876" stroke-width="1.6"/>
    </g>
    <text x="135" y="58" font-size="13.5" font-weight="700" fill="#16202b">CSS puro</text>
    <rect x="45" y="80" width="180" height="30" rx="15" fill="#17456f"/>
    <text x="135" y="100" font-size="12" fill="#ffffff">Guardar</text>
    <rect x="45" y="130" width="180" height="110" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="55" y="150" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">.boton {</text>
    <text x="55" y="166" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">  background: #17456f;</text>
    <text x="55" y="182" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">  color: white;</text>
    <text x="55" y="198" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">  padding: .5rem 1rem;</text>
    <text x="55" y="214" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">  border-radius: 999px;</text>
    <text x="55" y="230" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">}</text>

    <g filter="url(#bt-sombra)">
      <rect x="265" y="30" width="230" height="240" rx="10" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
    </g>
    <text x="380" y="58" font-size="13.5" font-weight="700" fill="#17456f">Bootstrap</text>
    <rect x="290" y="80" width="180" height="30" rx="6" fill="#17456f"/>
    <text x="380" y="100" font-size="12" fill="#ffffff">Guardar</text>
    <rect x="290" y="130" width="180" height="60" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="300" y="150" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">&lt;button</text>
    <text x="300" y="166" font-size="9.5" fill="#17456f" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">  class="btn btn-primary"&gt;</text>
    <text x="300" y="182" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">Guardar&lt;/button&gt;</text>
    <text x="380" y="215" font-size="10.5" fill="#5b6876">Una clase, el color y la</text>
    <text x="380" y="231" font-size="10.5" fill="#5b6876">forma ya vienen definidos</text>

    <g filter="url(#bt-sombra)">
      <rect x="510" y="30" width="230" height="240" rx="10" fill="#f4faf7" stroke="#0e8f8f" stroke-width="1.6"/>
    </g>
    <text x="625" y="58" font-size="13.5" font-weight="700" fill="#0e8f8f">Tailwind</text>
    <rect x="535" y="80" width="180" height="30" rx="15" fill="#0e8f8f"/>
    <text x="625" y="100" font-size="12" fill="#ffffff">Guardar</text>
    <rect x="535" y="130" width="180" height="90" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="545" y="150" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">&lt;button class="bg-teal-600</text>
    <text x="545" y="166" font-size="9.5" fill="#0e8f8f" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">  text-white px-4 py-2</text>
    <text x="545" y="182" font-size="9.5" fill="#0e8f8f" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">  rounded-full"&gt;</text>
    <text x="545" y="198" font-size="9.5" fill="#5b6876" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start">Guardar&lt;/button&gt;</text>
    <text x="625" y="245" font-size="10.5" fill="#5b6876">Cada clase pone una sola</text>
    <text x="625" y="261" font-size="10.5" fill="#5b6876">propiedad, ninguna esconde nada</text>
  </g>
</svg>
