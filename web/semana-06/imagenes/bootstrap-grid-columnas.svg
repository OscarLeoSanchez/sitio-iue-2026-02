<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="El grid de Bootstrap: un container centra el contenido, una row agrupa columnas, y doce columnas reparten el ancho disponible" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bg-sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#bg-sombra)">
      <rect x="40" y="30" width="640" height="240" rx="10" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
    </g>
    <text x="360" y="55" font-size="13" font-weight="700" fill="#17456f">.container</text>

    <rect x="70" y="70" width="580" height="70" rx="6" fill="#ffffff" stroke="#17456f" stroke-width="1.3"/>
    <text x="90" y="88" font-size="11" fill="#17456f" text-anchor="start">.row</text>
    <rect x="90" y="98" width="180" height="32" fill="#dfeaf5" stroke="#2f7bb8"/>
    <text x="180" y="119" font-size="10" fill="#17456f">col-4</text>
    <rect x="280" y="98" width="180" height="32" fill="#dfeaf5" stroke="#2f7bb8"/>
    <text x="370" y="119" font-size="10" fill="#17456f">col-4</text>
    <rect x="470" y="98" width="180" height="32" fill="#dfeaf5" stroke="#2f7bb8"/>
    <text x="560" y="119" font-size="10" fill="#17456f">col-4</text>

    <rect x="70" y="155" width="580" height="70" rx="6" fill="#ffffff" stroke="#17456f" stroke-width="1.3"/>
    <text x="90" y="173" font-size="11" fill="#17456f" text-anchor="start">.row</text>
    <rect x="90" y="183" width="90" height="32" fill="#dfeaf5" stroke="#2f7bb8"/>
    <text x="135" y="204" font-size="9.5" fill="#17456f">col-2</text>
    <rect x="185" y="183" width="270" height="32" fill="#dfeaf5" stroke="#2f7bb8"/>
    <text x="320" y="204" font-size="9.5" fill="#17456f">col-6</text>
    <rect x="460" y="183" width="190" height="32" fill="#dfeaf5" stroke="#2f7bb8"/>
    <text x="555" y="204" font-size="9.5" fill="#17456f">col-4</text>

    <text x="360" y="252" font-size="11.5" fill="#5b6876">Cada fila suma doce columnas: 4+4+4, o 2+6+4</text>
  </g>
</svg>
