project:
  type: website
  output-dir: docs
  # Sin .nojekyll, GitHub procesa el sitio con Jekyll y puede alterar la salida.
  # Va como recurso porque cada render recrea docs/ desde cero.
  resources:
    - .nojekyll

lang: es

website:
  title: "Clases IUE 2026-02"
  description: "Material de Programación Móvil y Programación Web. Institución Universitaria de Envigado."
  site-url: "https://oscarleosanchez.github.io/sitio-iue-2026-02/"
  search:
    location: navbar
    type: overlay
  navbar:
    background: "#0f2540"
    foreground: "#ffffff"
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Programación Móvil"
        href: movil/index.qmd
      - text: "Programación Web"
        href: web/index.qmd
  sidebar:
    - id: movil
      title: "Programación Móvil"
      style: docked
      background: light
      contents:
        - text: "Presentación del curso"
          href: movil/index.qmd
        - section: "Unidad 1. Fundamentos del desarrollo móvil"
          contents:
            - text: "Semana 1. Instalación del entorno"
              href: movil/semana-01/index.qmd
    - id: web
      title: "Programación Web"
      style: docked
      background: light
      contents:
        - text: "Presentación del curso"
          href: web/index.qmd
  page-footer:
    background: light
    left: "Oscar Leonel Sánchez Conde · Facultad de Ingenierías"
    center: "Institución Universitaria de Envigado · Semestre 2026-02"
    right: "[Código fuente](https://github.com/OscarLeoSanchez/sitio-iue-2026-02)"

format:
  html:
    theme:
      - cosmo
      - estilos/estilo.scss
    toc: true
    toc-depth: 3
    toc-title: "En esta guía"
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    fig-align: left
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  echo: false
  freeze: auto
