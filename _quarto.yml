project:
  type: website
  output-dir: docs
  # Sin .nojekyll, GitHub procesa el sitio con Jekyll y puede alterar la salida.
  # Va como recurso porque cada render recrea docs/ desde cero.
  resources:
    - .nojekyll

lang: es

website:
  title: "Clases IUE 2026-02"
  description: "Material de Programación Móvil y Programación Web. Institución Universitaria de Envigado."
  site-url: "https://oscarleosanchez.github.io/sitio-iue-2026-02/"
  favicon: estilos/favicon.svg
  search:
    location: sidebar
    type: textbox
  # Sin navbar a proposito: cada estudiante entra por el enlace de su curso y
  # no debe ver el otro. La navegacion vive en la barra lateral de cada curso.
  sidebar:
    - id: movil
      title: "Programación Móvil"
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: movil/index.qmd
        - section: "Unidad 1. Fundamentos del desarrollo móvil"
          contents:
            - text: "Semana 1. Instalación del entorno"
              href: movil/semana-01/index.qmd
    - id: web
      title: "Programación Web"
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Presentación del curso"
          href: web/index.qmd
  page-footer:
    background: light
    left: "Oscar Leonel Sánchez Conde"
    center: "Institución Universitaria de Envigado. Facultad de Ingenierías"
    right: "Semestre 2026-02"

format:
  html:
    theme:
      - cosmo
      - estilos/estilo.scss
    # Anchos nominales de la grilla. Quarto los ajusta al espacio disponible,
    # asi que el cuerpo termina entre 875px y 930px segun la pantalla. El
    # centrado del bloque completo se hace en estilo.scss.
    grid:
      sidebar-width: 290px
      body-width: 780px
      margin-width: 270px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: "En esta guía"
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    fig-align: left
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  echo: false
  freeze: auto
