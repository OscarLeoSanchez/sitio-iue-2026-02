  <text x="290" y="133" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#ffffff">main</text>
  <line x1="800" y1="146" x2="800" y2="168" stroke="#0e8f8f" stroke-width="2" marker-end="url(#rp-punta)"/>
  <rect x="765" y="114" width="70" height="28" rx="6" fill="#0e8f8f"/>
  <text x="800" y="133" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#ffffff">main</text>
