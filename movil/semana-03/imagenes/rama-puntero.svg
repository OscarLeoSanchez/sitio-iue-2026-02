      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f2540" flood-opacity="0.13"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f2540">
