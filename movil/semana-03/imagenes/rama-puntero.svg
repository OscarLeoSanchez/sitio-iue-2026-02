    <circle cx="290" cy="196" r="24" fill="#ffffff" stroke="#2f7bb8" stroke-width="2"/>
    <circle cx="530" cy="196" r="24" fill="#ffffff" stroke="#2f7bb8" stroke-width="2"/>
