  <text x="710" y="133" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#cfd8e3">main</text>
  <text x="800" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#0e8f8f">commit nuevo</text>
  <text x="450" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#5b6876">La rama solo cambia de commit. No copia ni un solo archivo.</text>
