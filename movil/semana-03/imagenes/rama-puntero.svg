<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Antes y despues de commitear: la etiqueta main se mueve al commit nuevo sin copiar archivos" xmlns="http://www.w3.org/2000/svg">
  <defs>
