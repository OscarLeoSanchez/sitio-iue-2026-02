<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Los cinco comandos que mueven el trabajo entre las areas de Git y para que sirve cada uno" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" text-anchor="middle" fill="#ffffff">
    <rect x="40" y="20" width="270" height="44" rx="8" fill="#17456f"/>
    <text x="175" y="48">git add &lt;archivo&gt;</text>
    <rect x="40" y="78" width="270" height="44" rx="8" fill="#17456f"/>
    <text x="175" y="106">git commit -m "..."</text>
    <rect x="40" y="136" width="270" height="44" rx="8" fill="#17456f"/>
    <text x="175" y="164">git push</text>
    <rect x="40" y="194" width="270" height="44" rx="8" fill="#17456f"/>
    <text x="175" y="222">git pull</text>
  </g>
  <rect x="40" y="252" width="270" height="44" rx="8" fill="#ffffff" stroke="#5b6876" stroke-width="1.8"/>
  <text x="175" y="280" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#5b6876">git restore &lt;archivo&gt;</text>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#16202b">
    <text x="350" y="48">escoge qué cambios entran en la próxima foto</text>
    <text x="350" y="106">guarda la foto en la historia de tu computador</text>
    <text x="350" y="164">sube esa historia a GitHub</text>
    <text x="350" y="222">baja lo que publicaste desde otro lado</text>
    <text x="350" y="280" fill="#5b6876">bota los cambios que todavía no guardaste</text>
  </g>
</svg>
