<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="325" viewBox="0 0 760 325" role="img" aria-label="Diagrama de las cuatro areas de Git: directorio de trabajo, area de preparacion, repositorio local y repositorio remoto, con los comandos que mueven el contenido entre ellas" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="d1-punta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#17456f"/>
    </marker>
    <marker id="d1-punta-gris" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5b6876"/>
    </marker>
    <filter id="d1-sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.14"/>
    </filter>
  </defs>
  <text x="285" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="1.4" fill="#5b6876">EN TU COMPUTADOR</text>
  <text x="665" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" letter-spacing="1.4" fill="#5b6876">EN GITHUB</text>
  <line x1="570" y1="125" x2="570" y2="240" stroke="#cfd8e3" stroke-width="1.5" stroke-dasharray="5 5"/>
  <g filter="url(#d1-sombra)">
    <rect x="10" y="140" width="170" height="96" rx="8" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <rect x="200" y="140" width="170" height="96" rx="8" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <rect x="390" y="140" width="170" height="96" rx="8" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5"/>
    <rect x="580" y="140" width="170" height="96" rx="8" fill="#ffffff" stroke="#a8d5d2" stroke-width="1.5"/>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="95" y="172" font-size="14" font-weight="700" fill="#0f2540">Directorio de trabajo</text>
    <line x1="78" y1="182" x2="112" y2="182" stroke="#2f7bb8" stroke-width="2.5"/>
    <text x="95" y="203" font-size="11.5" fill="#5b6876">Los archivos que</text>
    <text x="95" y="219" font-size="11.5" fill="#5b6876">abres en VS Code</text>
    <text x="285" y="172" font-size="14" font-weight="700" fill="#0f2540">Área de preparación</text>
    <line x1="268" y1="182" x2="302" y2="182" stroke="#2f7bb8" stroke-width="2.5"/>
    <text x="285" y="203" font-size="11.5" fill="#5b6876">Lo que entrará en</text>
    <text x="285" y="219" font-size="11.5" fill="#5b6876">el próximo commit</text>
    <text x="475" y="172" font-size="14" font-weight="700" fill="#0f2540">Repositorio local</text>
    <line x1="458" y1="182" x2="492" y2="182" stroke="#2f7bb8" stroke-width="2.5"/>
    <text x="475" y="203" font-size="11.5" fill="#5b6876">La carpeta oculta .git</text>
    <text x="475" y="219" font-size="11.5" fill="#5b6876">con toda la historia</text>
    <text x="665" y="172" font-size="14" font-weight="700" fill="#0f2540">Repositorio remoto</text>
    <line x1="648" y1="182" x2="682" y2="182" stroke="#0e8f8f" stroke-width="2.5"/>
    <text x="665" y="203" font-size="11.5" fill="#5b6876">Tu copia en GitHub,</text>
    <text x="665" y="219" font-size="11.5" fill="#5b6876">tu respaldo en la nube</text>
  </g>
  <g fill="none" stroke="#17456f" stroke-width="2" marker-end="url(#d1-punta)">
    <path d="M 95,140 Q 190,52 285,140"/>
    <path d="M 285,140 Q 380,52 475,140"/>
    <path d="M 475,140 Q 570,52 665,140"/>
  </g>
  <g>
    <rect x="153" y="85" width="74" height="23" rx="11.5" fill="#17456f"/>
    <text x="190" y="101" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ffffff">git add</text>
    <rect x="332" y="85" width="96" height="23" rx="11.5" fill="#17456f"/>
    <text x="380" y="101" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ffffff">git commit</text>
    <rect x="530" y="85" width="80" height="23" rx="11.5" fill="#17456f"/>
    <text x="570" y="101" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ffffff">git push</text>
  </g>
  <g fill="none" stroke="#5b6876" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#d1-punta-gris)">
    <path d="M 285,236 Q 190,282 95,236"/>
    <path d="M 475,236 Q 285,350 95,236"/>
    <path d="M 665,236 Q 570,290 475,236"/>
  </g>
  <g>
    <rect x="105" y="248" width="170" height="23" rx="11.5" fill="#ffffff" stroke="#5b6876" stroke-width="1.2"/>
    <text x="190" y="264" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#5b6876">git restore --staged</text>
    <rect x="233" y="282" width="104" height="23" rx="11.5" fill="#ffffff" stroke="#5b6876" stroke-width="1.2"/>
    <text x="285" y="298" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#5b6876">git restore</text>
    <rect x="530" y="252" width="80" height="23" rx="11.5" fill="#ffffff" stroke="#5b6876" stroke-width="1.2"/>
    <text x="570" y="268" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12.5" fill="#5b6876">git pull</text>
  </g>
</svg>
