<?xml version="1.0" encoding="UTF-8"?>
<svg width="950" height="450" viewBox="0 0 950 450" role="img" aria-label="Los tres arboles paralelos de Flutter: el arbol de widgets, el arbol de elements y el arbol de render objects. Cada widget genera un element, y solo los elements de tipo render generan un render object. MiWidget es un StatelessWidget: no tiene RenderObject propio, asi que su hijo Icon se conecta directo al RenderObject de Center, el ancestro mas cercano que si tiene uno" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flecha-arboles" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
