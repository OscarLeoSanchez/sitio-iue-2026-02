  <path d="M 582,210 L 606,210" stroke="#c3ccd9" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>

  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="98" y="83" width="104" height="34" rx="6" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
    <text x="150" y="105" fill="#17456f">Center</text>

    <rect x="38" y="193" width="104" height="34" rx="6" fill="#eef3fb" stroke="#17456f" stroke-width="2"/>
