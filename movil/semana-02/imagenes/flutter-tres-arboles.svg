  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-style="italic" fill="#94a3b8" text-anchor="middle">
    <text x="210" y="248" font-size="10">(StatelessWidget)</text>
    <text x="530" y="248" font-size="10">(no crea RenderObject)</text>

    <text x="850" y="203" font-size="10">(MiWidget)</text>
    <text x="850" y="217" font-size="10">sin RenderObject propio</text>
    <text x="850" y="350" font-size="10">conectado directo a Center</text>

    <text x="475" y="410" font-size="11.5">Cada widget crea un element; solo los elements de tipo render crean un render object.</text>
    <text x="475" y="427" font-size="11.5">MiWidget no tiene RenderObject propio: su hijo se conecta con el del ancestro mas cercano que si lo tiene.</text>
