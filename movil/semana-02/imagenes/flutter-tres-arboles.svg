  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="738" y="83" width="104" height="34" rx="6" fill="#fbecf2" stroke="#9b2c5e" stroke-width="2"/>
