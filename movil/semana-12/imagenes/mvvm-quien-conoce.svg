<text x="126" y="360.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3d4a57">conoce a: <tspan font-weight="400" fill="#26323d" font-size="13.5">_service</tspan></text>
<path d="M110,438 L110,488" fill="none" stroke="#3d4a57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flecha)"/>
<rect x="122" y="451.0" width="190" height="24" rx="5" fill="#ffffff"/>
<text x="126" y="468.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3d4a57">conoce a: <tspan font-weight="400" fill="#26323d" font-size="13.5">_coleccion</tspan></text>
<path d="M300,164 L300,114" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flecha-tomate)"/>
<path d="M290,129.0 L310,149.0 M310,129.0 L290,149.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round" fill="none"/>
<rect x="318" y="127.0" width="164" height="24" rx="5" fill="#ffffff"/>
<text x="322" y="144.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8e2418">no conoce a la Vista</text>
<text x="500" y="34" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#26323d">El dato viaja en dos sentidos</text>
<g data-box="1">
<rect x="500" y="60" width="100" height="170" rx="12" ry="12" fill="#e3f0fb" stroke="#2b7bbf" stroke-width="2.5"/>
<text x="550.0" y="149.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#174f80">Vista</text>
</g>
<g data-box="1">
<rect x="770" y="60" width="100" height="170" rx="12" ry="12" fill="#fff3cf" stroke="#c98a00" stroke-width="2.5"/>
<text x="820.0" y="149.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#7a5200">ViewModel</text>
</g>
<text x="685.0" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7a5200">El evento sube</text>
<path d="M600,114 L770,114" fill="none" stroke="#3d4a57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flecha)"/>
<text x="685.0" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#26323d">vm.agregar(...)</text>
<text x="685.0" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7a5200">El estado baja</text>
<path d="M770,192 L600,192" fill="none" stroke="#3d4a57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flecha)"/>
<text x="685.0" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#26323d">vm.productos y vm.error</text>
<g data-box="1">
<rect x="500" y="258" width="370" height="92" rx="12" ry="12" fill="#fff3cf" stroke="#c98a00" stroke-width="2.5"/>
<text x="685.0" y="288.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d">El ViewModel avisa con notifyListeners():</text>
<text x="685.0" y="308.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d">mi estado cambió. La Vista escucha con</text>
<text x="685.0" y="328.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d">ListenableBuilder y decide redibujarse.</text>
</g>
<g data-box="1">
<rect x="500" y="380" width="370" height="112" rx="12" ry="12" fill="#fde8e6" stroke="#c0392b" stroke-width="2.5"/>
<text x="685.0" y="410.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8e2418">Nadie conoce hacia arriba</text>
<text x="685.0" y="431.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d">El ViewModel no sabe que existe una Vista.</text>
<text x="685.0" y="451.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d">El Repository no sabe que existe</text>
<text x="685.0" y="471.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d">un ViewModel.</text>
</g>
