<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<defs><marker id="flecha" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#3d4a57"/></marker><marker id="flecha-t" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#c0392b"/></marker><marker id="flecha-m" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#c98a00"/></marker></defs>
<rect width="900" height="500" fill="#ffffff"/>
<text x="14" y="32" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#174f80">presentation: lo que el usuario ve y toca</text>
<rect x="10" y="44" width="286" height="112" rx="12" ry="12" fill="#e3f0fb" stroke="#2b7bbf" stroke-width="2.5"/>
<text x="24" y="68" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#174f80">ViewModel</text>
<text x="24" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#174f80">ProductosViewModel</text>
<text x="24" y="116" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700">hace:</tspan> guarda el estado de la pantalla</text>
<text x="24" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700" fill="#8e2418">no hace:</tspan> dibujar widgets</text>
<rect x="307" y="44" width="286" height="112" rx="12" ry="12" fill="#e3f0fb" stroke="#2b7bbf" stroke-width="2.5"/>
<text x="321" y="68" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#174f80">pantalla</text>
<text x="321" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#174f80">ProductosPantalla</text>
<text x="321" y="116" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700">hace:</tspan> dibuja y recoge lo que se toca</text>
<text x="321" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700" fill="#8e2418">no hace:</tspan> validar ni conocer Firestore</text>
<text x="14" y="196" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b5e3a">domain: lo que la app es y hace</text>
<rect x="10" y="208" width="286" height="112" rx="12" ry="12" fill="#e4f4e8" stroke="#2e8b57" stroke-width="2.5"/>
<text x="24" y="232" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b5e3a">entidad</text>
<text x="24" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1b5e3a">NuevoProducto</text>
<text x="24" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700">hace:</tspan> valida nombre y precio</text>
<text x="24" y="304" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700" fill="#8e2418">no hace:</tspan> saber de dónde viene</text>
<rect x="307" y="208" width="286" height="112" rx="12" ry="12" fill="#e4f4e8" stroke="#2e8b57" stroke-width="2.5"/>
<text x="321" y="232" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b5e3a">caso de uso</text>
<text x="321" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1b5e3a">AgregarProducto</text>
<text x="321" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700">hace:</tspan> nombra una acción y la pide</text>
<text x="321" y="304" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700" fill="#8e2418">no hace:</tspan> saber si es nube o teléfono</text>
<rect x="604" y="208" width="286" height="112" rx="12" ry="12" fill="#e4f4e8" stroke="#2e8b57" stroke-width="2.5"/>
<text x="618" y="232" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b5e3a">contrato</text>
<text x="618" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1b5e3a">ProductosRepository</text>
<text x="618" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700">hace:</tspan> declara lo que se necesita</text>
<text x="618" y="304" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700" fill="#8e2418">no hace:</tspan> decir cómo ni tener código</text>
<text x="14" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#4f2c73">data: lo que sabe de dónde vienen los datos</text>
<rect x="10" y="372" width="286" height="112" rx="12" ry="12" fill="#efe6f8" stroke="#7b4fa3" stroke-width="2.5"/>
<text x="24" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4f2c73">DTO</text>
<text x="24" y="418" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4f2c73">ProductoDto</text>
<text x="24" y="444" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700">hace:</tspan> traduce lo de cada fuente</text>
<text x="24" y="468" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700" fill="#8e2418">no hace:</tspan> salir de data</text>
<rect x="307" y="372" width="286" height="112" rx="12" ry="12" fill="#efe6f8" stroke="#7b4fa3" stroke-width="2.5"/>
<text x="321" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4f2c73">repositorio de Firestore</text>
<text x="321" y="418" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4f2c73">FirestoreProductosRepository</text>
<text x="321" y="444" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700">hace:</tspan> cumple el contrato en la nube</text>
<text x="321" y="468" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700" fill="#8e2418">no hace:</tspan> aplicar la regla del precio</text>
<rect x="604" y="372" width="286" height="112" rx="12" ry="12" fill="#efe6f8" stroke="#7b4fa3" stroke-width="2.5"/>
<text x="618" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4f2c73">repositorio de SQLite</text>
<text x="618" y="418" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4f2c73">SqliteProductosRepository</text>
<text x="618" y="444" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700">hace:</tspan> cumple el contrato en el teléfono</text>
<text x="618" y="468" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26323d"><tspan font-weight="700" fill="#8e2418">no hace:</tspan> ser importado por el dominio</text>
</svg>
