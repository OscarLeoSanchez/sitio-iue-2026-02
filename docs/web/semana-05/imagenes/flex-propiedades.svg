<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Comparacion visual de los valores mas usados de justify-content: flex-start, center, space-between, y de align-items: flex-start, center, stretch" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="p1-sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="20" y="22" font-size="13" font-weight="700" fill="#17456f">justify-content (eje principal)</text>

    <g filter="url(#p1-sombra)">
      <rect x="20" y="34" width="200" height="70" rx="8" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.3"/>
      <rect x="260" y="34" width="200" height="70" rx="8" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.3"/>
      <rect x="500" y="34" width="200" height="70" rx="8" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.3"/>
    </g>
    <rect x="30" y="52" width="28" height="34" rx="4" fill="#2f7bb8"/>
    <rect x="64" y="52" width="28" height="34" rx="4" fill="#2f7bb8"/>
    <text x="120" y="118" text-anchor="middle" font-size="11.5" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">flex-start</text>

    <rect x="330" y="52" width="28" height="34" rx="4" fill="#2f7bb8"/>
    <rect x="364" y="52" width="28" height="34" rx="4" fill="#2f7bb8"/>
    <text x="360" y="118" text-anchor="middle" font-size="11.5" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">center</text>

    <rect x="510" y="52" width="28" height="34" rx="4" fill="#2f7bb8"/>
    <rect x="662" y="52" width="28" height="34" rx="4" fill="#2f7bb8"/>
    <text x="600" y="118" text-anchor="middle" font-size="11.5" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">space-between</text>

    <text x="20" y="172" font-size="13" font-weight="700" fill="#0e8f8f">align-items (eje cruzado)</text>

    <g filter="url(#p1-sombra)">
      <rect x="20" y="184" width="200" height="110" rx="8" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.3"/>
      <rect x="260" y="184" width="200" height="110" rx="8" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.3"/>
      <rect x="500" y="184" width="200" height="110" rx="8" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.3"/>
    </g>

    <rect x="40" y="196" width="60" height="36" rx="4" fill="#0e8f8f"/>
    <text x="120" y="326" text-anchor="middle" font-size="11.5" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">flex-start</text>

    <rect x="290" y="222" width="60" height="36" rx="4" fill="#0e8f8f"/>
    <text x="360" y="326" text-anchor="middle" font-size="11.5" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">center</text>

    <rect x="520" y="196" width="60" height="86" rx="4" fill="#0e8f8f" opacity="0.85"/>
    <text x="600" y="326" text-anchor="middle" font-size="11.5" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">stretch</text>

    <text x="360" y="372" text-anchor="middle" font-size="11.5" fill="#5b6876">Los dos ejes se combinan: cada item cae en la interseccion de su fila y su columna.</text>
  </g>
</svg>
