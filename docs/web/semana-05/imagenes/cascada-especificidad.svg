<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Orden de especificidad en CSS de menor a mayor: elemento, clase o atributo o pseudo-clase, id, y estilo en linea, con important por encima de todo" xmlns="http://www.w3.org/2000/svg">
  <defs>
