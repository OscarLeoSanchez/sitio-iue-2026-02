<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Anatomia de un documento HTML: DOCTYPE, la etiqueta html con su atributo lang, el head con los metadatos que no se ven, y el body con el contenido visible" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="a1-sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2540" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="20" y="20" width="220" height="34" rx="7" fill="#eef2f6" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="130" y="42" text-anchor="middle" font-size="13" fill="#5b6876" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">&lt;!DOCTYPE html&gt;</text>
    <text x="260" y="42" font-size="12" fill="#5b6876">Usa las reglas modernas de HTML5</text>

    <g filter="url(#a1-sombra)">
      <rect x="20" y="70" width="680" height="270" rx="10" fill="#ffffff" stroke="#2f7bb8" stroke-width="2"/>
    </g>
    <text x="40" y="96" font-size="13" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" fill="#17456f" font-weight="700">&lt;html lang="es"&gt;</text>
    <text x="230" y="96" font-size="12" fill="#5b6876">La etiqueta raiz, con el idioma del contenido</text>

    <g filter="url(#a1-sombra)">
      <rect x="42" y="112" width="636" height="86" rx="8" fill="#f6f8fa" stroke="#cfd8e3" stroke-width="1.5"/>
    </g>
    <text x="60" y="134" font-size="13" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" fill="#5b6876" font-weight="700">&lt;head&gt;</text>
    <text x="230" y="134" font-size="12" fill="#5b6876">Metadatos: no se ven en pantalla</text>
    <rect x="60" y="146" width="600" height="20" rx="4" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="68" y="160" font-size="11" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" fill="#0e8f8f">&lt;meta charset="UTF-8"&gt;</text>
    <text x="330" y="160" font-size="10.5" fill="#5b6876">Codificacion de caracteres, tildes y ene</text>
    <rect x="60" y="170" width="600" height="20" rx="4" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="68" y="184" font-size="11" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" fill="#0e8f8f">&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;</text>

    <g filter="url(#a1-sombra)">
      <rect x="42" y="212" width="636" height="106" rx="8" fill="#ffffff" stroke="#a8d5d2" stroke-width="1.5"/>
    </g>
    <text x="60" y="234" font-size="13" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" fill="#0e8f8f" font-weight="700">&lt;body&gt;</text>
    <text x="230" y="234" font-size="12" fill="#5b6876">Todo el contenido visible de la pagina</text>
    <rect x="60" y="246" width="600" height="56" rx="6" fill="#f2f7fb" stroke="#cfd8e3" stroke-dasharray="4 3"/>
    <text x="360" y="278" text-anchor="middle" font-size="12" fill="#0f2540">&lt;h1&gt;, &lt;p&gt;, &lt;header&gt;, &lt;main&gt;, imagenes, enlaces...</text>
  </g>
</svg>
