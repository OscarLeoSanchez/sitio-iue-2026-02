<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Reintento con espera creciente: intento, espera de 500 ms, intento, espera de 1000 ms, intento, error final" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<path d="M 20 146 L 700 146" fill="none" stroke="#8795a3" stroke-width="1.2" marker-end="url(#f-gris)"/>
<rect x="30" y="50" width="90" height="70" rx="6" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.6"/>
<text x="75.0" y="80" font-size="12.5" fill="#a32d22" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Intento 1</text>
<text x="75.0" y="102" font-size="11.5" fill="#a32d22" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">falla</text>
<rect x="120" y="50" width="60" height="70" rx="6" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="150.0" y="80" font-size="12.5" fill="#3a4654" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">espera</text>
<text x="150.0" y="102" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">500 ms</text>
<rect x="180" y="50" width="90" height="70" rx="6" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.6"/>
<text x="225.0" y="80" font-size="12.5" fill="#a32d22" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Intento 2</text>
<text x="225.0" y="102" font-size="11.5" fill="#a32d22" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">falla</text>
<rect x="270" y="50" width="130" height="70" rx="6" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="335.0" y="80" font-size="12.5" fill="#3a4654" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">espera</text>
<text x="335.0" y="102" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">1000 ms</text>
<rect x="400" y="50" width="90" height="70" rx="6" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.6"/>
<text x="445.0" y="80" font-size="12.5" fill="#a32d22" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Intento 3</text>
<text x="445.0" y="102" font-size="11.5" fill="#a32d22" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">falla</text>
<rect x="520" y="50" width="180" height="70" rx="8" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.6"/>
<text x="610.0" y="72" font-size="12.5" fill="#a32d22" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Se muestra el error</text>
<text x="610.0" y="94" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">con el botón Reintentar</text>
<path d="M 492 85 L 516 85" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<rect x="20" y="176" width="330" height="140" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="185" y="202" font-size="13" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Sí vale la pena reintentar</text>
<text x="34" y="226" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Sin conexión (TypeError).</text>
<text x="34" y="244" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Tiempo agotado (TimeoutError).</text>
<text x="34" y="262" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">5xx: el servidor falló y puede</text>
<text x="34" y="280" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">recuperarse en segundos.</text>
<rect x="370" y="176" width="330" height="140" rx="8" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.6"/>
<text x="535" y="202" font-size="13" fill="#a32d22" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">No tiene sentido reintentar</text>
<text x="384" y="226" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">4xx: tu petición está mal y lo</text>
<text x="384" y="244" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">estará igual la próxima vez.</text>
<text x="384" y="262" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">JSON inválido: el servidor</text>
<text x="384" y="280" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">enviará lo mismo.</text>
<text x="360" y="30" font-size="12.5" fill="#16202b" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Duplicar la espera evita saturar a un servidor que ya está en problemas</text>
</g>
</svg>
