<text x="34" y="82" font-size="10.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">setTimeout(() =&gt; console.log("B"), 0);</text>
<text x="34" y="106" font-size="10.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Promise.resolve()</text>
<text x="34" y="130" font-size="10.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">  .then(() =&gt; console.log("C"));</text>
<text x="34" y="154" font-size="10.5" fill="#16202b" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">console.log("D");</text>
