<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Orden de salida de un ejemplo: A, D, C, B. Primero lo sincrónico, luego las microtareas, luego las tareas" xmlns="http://www.w3.org/2000/svg">
