<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="470" viewBox="0 0 560 470" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Recorrido de una petición por MVC</title>
<desc id="d">La petición GET /catalogo llega a una ruta con atributo HttpGet, que lleva a CatalogoController.Index. El controlador toma el modelo, una lista de Producto. Si devuelve View con el modelo, la vista Index.cshtml arma el HTML; si devuelve la lista sin vista, la respuesta es JSON. Ambas terminan en la respuesta.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="560" height="470" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="14" y="12" width="300" height="52" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="164.0" y="35.0" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Petición</text>
<text x="164.0" y="53.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">GET /catalogo</text>
<path d="M 164.0 64 L 164.0 90" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="14" y="90" width="300" height="52" rx="8" fill="#f0f9f9" stroke="#0e8f8f" stroke-width="1.6"/>
<text x="164.0" y="113.0" font-size="13.5" fill="#0a6464" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Ruta</text>
<text x="164.0" y="131.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">[HttpGet("catalogo")]</text>
<text x="330" y="112" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">La dirección y el verbo</text>
<text x="330" y="128" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">eligen el método.</text>
<path d="M 164.0 142 L 164.0 168" fill="none" stroke="#0e8f8f" stroke-width="1.6" marker-end="url(#f-teal)"/>
<rect x="14" y="168" width="300" height="52" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="164.0" y="191.0" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Controlador</text>
<text x="164.0" y="209.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">CatalogoController.Index()</text>
<text x="330" y="190" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Recibe lo que piden,</text>
<text x="330" y="206" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">reúne los datos y decide</text>
<text x="330" y="222" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">qué responder.</text>
<path d="M 164.0 220 L 164.0 246" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<rect x="14" y="246" width="300" height="52" rx="8" fill="#f6f2fa" stroke="#7a4fa0" stroke-width="1.6"/>
<text x="164.0" y="269.0" font-size="13.5" fill="#53307a" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Modelo</text>
<text x="164.0" y="287.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">List&lt;Producto&gt;</text>
<text x="330" y="268" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">La ficha del producto:</text>
<text x="330" y="284" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">solo datos.</text>
<path d="M 94 298 L 94 338" fill="none" stroke="#7a4fa0" stroke-width="1.6" marker-end="url(#f-viol)"/>
<path d="M 234 298 L 234 338" fill="none" stroke="#7a4fa0" stroke-width="1.6" marker-end="url(#f-viol)"/>
<text x="94" y="318" font-size="11.5" fill="#53307a" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">View(modelo)</text>
<text x="234" y="318" font-size="11.5" fill="#53307a" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">la lista sola</text>
<rect x="14" y="338" width="140" height="56" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="84.0" y="363.0" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Vista Razor</text>
<text x="84.0" y="381.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Index.cshtml</text>
<rect x="174" y="338" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.6"/>
<text x="244.0" y="363.0" font-size="13.5" fill="#5b6876" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">JSON</text>
<text x="244.0" y="381.0" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">sin vista</text>
<text x="330" y="356" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Con vista, el HTML</text>
<text x="330" y="372" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">sale armado con el</text>
<text x="330" y="388" font-size="12" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">modelo.</text>
<path d="M 84 394 L 84 418 L 164 418" fill="none" stroke="#b7791f" stroke-width="1.6"/>
<path d="M 244 394 L 244 418 L 164 418" fill="none" stroke="#8795a3" stroke-width="1.6"/>
<path d="M 164 418 L 164 430" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="14" y="430" width="300" height="34" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="164.0" y="452.0" font-size="12.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Respuesta: 200 con HTML o con JSON</text>
</g>
</svg>
