<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="290" viewBox="0 0 640 290" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Una petición recorre el pipeline de ida y vuelta</title>
<desc id="d">La petición GET /salud entra, pasa por el middleware de registro que arranca el reloj, llega al endpoint y la respuesta 200 vuelve por el mismo camino; al volver, el registro imprime la línea.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker></defs>
<rect x="0" y="0" width="640" height="290" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="50" width="160" height="70" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="100.0" y="72" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Navegador</text>
<text x="100.0" y="92" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el cliente</text>
<rect x="240" y="50" width="160" height="70" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="320.0" y="72" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Registro</text>
<text x="320.0" y="92" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">middleware</text>
<rect x="460" y="50" width="160" height="70" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="540.0" y="72" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Endpoint</text>
<text x="540.0" y="92" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">MapGet("/salud")</text>
<path d="M 182 74 L 238 74" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 402 74 L 458 74" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 458 100 L 402 100" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<path d="M 238 100 L 182 100" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="320" y="36" font-size="12" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">IDA: la petición entra</text>
<text x="320" y="146" font-size="12" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">VUELTA: la respuesta sale</text>
<rect x="160" y="160" width="320" height="66" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.4"/>
<text x="320" y="182" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Dentro de Registro</text>
<text x="320" y="201" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Antes de await siguiente(): arranca el reloj</text>
<text x="320" y="217" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Después: imprime GET /salud -&gt; 200 (0 ms)</text>
<rect x="20" y="244" width="600" height="34" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="320.0" y="265.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Lo que va después de await siguiente() corre cuando ya hay respuesta.</text>
</g>
</svg>
