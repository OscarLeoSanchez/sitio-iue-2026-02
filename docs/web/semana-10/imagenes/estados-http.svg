<text x="120.0" y="121" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">/api/productos/2</text>
<rect x="30" y="134" width="180" height="38" rx="5" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2"/>
