<rect x="250" y="222" width="210" height="38" rx="5" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="355.0" y="238" font-size="11" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">415 Unsupported Media Type</text>
<text x="355.0" y="253" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">POST sin tipo JSON</text>
