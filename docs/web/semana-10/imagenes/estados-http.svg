<text x="355.0" y="297" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">/api/tetera</text>
<rect x="490" y="20" width="170" height="300" rx="8" fill="#f6f2fa" stroke="#7a4fa0" stroke-width="1.6"/>
