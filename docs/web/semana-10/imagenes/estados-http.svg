<text x="575.0" y="70" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">falló el servidor</text>
<rect x="500" y="90" width="150" height="38" rx="5" fill="#ffffff" stroke="#7a4fa0" stroke-width="1.2"/>
<text x="575.0" y="106" font-size="11" fill="#53307a" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">500 Internal Server Error</text>
<text x="575.0" y="121" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">dos rutas iguales</text>
<rect x="20" y="338" width="640" height="32" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="340.0" y="358.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">El primer dígito dice quién tiene el problema: 2 nadie, 4 quien pidió, 5 el servidor.</text>
