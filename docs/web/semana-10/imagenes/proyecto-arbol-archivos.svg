<title id="t">Los archivos de un proyecto web vacío</title>
<desc id="d">Árbol de la carpeta Plaza. Program.cs es el archivo que editas, y desde la etapa 4 la carpeta wwwroot que creas tú. Plaza.csproj, appsettings.json, appsettings.Development.json y Properties/launchSettings.json no se tocan. La carpeta obj aparece al crear el proyecto y la carpeta bin aparece al compilar; ninguna se edita.</desc>
