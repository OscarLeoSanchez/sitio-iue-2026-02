<text x="473.0" y="192" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">int Cantidad</text>
<path d="M 208 187 L 226 187" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 366 187 L 394 187" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="280.0" y="236" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">El navegador une los pares con &amp;: cliente=Ana&amp;producto=Tomate&amp;cantidad=2</text>
<rect x="10" y="252" width="540" height="34" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="280.0" y="273.5" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">El nombre del campo sale del atributo name, no del id.</text>
<rect x="10" y="294" width="540" height="34" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="280.0" y="315.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Sin name, el campo no viaja. cliente se empareja con Cliente sin distinguir mayúsculas.</text>
