<title id="t">Anatomía del comando dotnet new web -n Plaza</title>
<desc id="d">El comando dotnet new web -n Plaza dividido en cinco partes: dotnet es el programa del SDK, new es el subcomando que crea algo nuevo, web es la plantilla de servidor web vacío, -n es la opción para dar nombre y Plaza es el nombre del proyecto y de su carpeta.</desc>
