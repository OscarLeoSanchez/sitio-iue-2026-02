<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Dos caminos llevan al mismo 404</title>
<desc id="d">Una petición primero busca una ruta que coincida. Si ninguna coincide, el servidor responde 404 con cuerpo vacío; por ejemplo /noexiste o /producto/tomate cuando la ruta pide un entero. Si una ruta coincide y la función no encuentra el producto, devuelve NotFound y también responde 404.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker></defs>
<rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="24" width="150" height="50" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="95" y="54" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Petición</text>
<rect x="230" y="24" width="200" height="50" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="330" y="54" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">¿Coincide una ruta?</text>
<path d="M 172 49 L 228 49" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 432 49 L 488 49" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-rojo)"/>
<text x="460" y="40" font-size="11.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">no</text>
<rect x="490" y="24" width="170" height="62" rx="8" fill="#fdf3f1" stroke="#a32d22" stroke-width="1.6"/>
<text x="575" y="48" font-size="13.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">404</text>
<text x="575" y="66" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">cuerpo vacío</text>
<text x="490" y="104" font-size="11" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">/noexiste</text>
<text x="490" y="120" font-size="11" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">/producto/tomate</text>
<text x="490" y="136" font-size="11" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">/sumar/3</text>
<path d="M 330 76 L 330 130" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="338" y="108" font-size="11.5" fill="#17456f" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">sí</text>
<rect x="230" y="132" width="200" height="50" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="330" y="162" font-size="12.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Se ejecuta la función</text>
<path d="M 330 184 L 330 222" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<rect x="230" y="224" width="200" height="50" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="330" y="254" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">¿Existe el producto?</text>
<path d="M 432 249 L 488 249" fill="none" stroke="#a32d22" stroke-width="1.6" marker-end="url(#f-rojo)"/>
<text x="460" y="240" font-size="11.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">no</text>
<rect x="490" y="224" width="170" height="62" rx="8" fill="#fdf3f1" stroke="#a32d22" stroke-width="1.6"/>
<text x="575" y="248" font-size="13.5" fill="#7a1f17" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">404</text>
<text x="575" y="266" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">NotFound()</text>
<text x="490" y="304" font-size="11" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">/api/productos/99</text>
<path d="M 228 249 L 172 249" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="200" y="240" font-size="11.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">sí</text>
<rect x="20" y="224" width="150" height="62" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="95" y="248" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">200</text>
<text x="95" y="266" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">devuelve el producto</text>
<rect x="20" y="318" width="640" height="30" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="340.0" y="337.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">En /producto/{id:int} el texto tomate no es un entero: la ruta no coincide y da 404.</text>
</g>
</svg>
