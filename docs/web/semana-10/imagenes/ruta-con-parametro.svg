<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="310" viewBox="0 0 680 310" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Una ruta con parámetro</title>
<desc id="d">La ruta /saludo/{nombre} comparada con la petición /saludo/Maria. El segmento saludo coincide tal cual y el segmento Maria se guarda en el parámetro nombre. La función recibe nombre igual a Maria y responde Hola, Maria. Bienvenido a la plaza.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker></defs>
<rect x="0" y="0" width="680" height="310" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<text x="110" y="85" font-size="12" fill="#5b6876" font-weight="600" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">ruta registrada</text>
<text x="110" y="225" font-size="12" fill="#5b6876" font-weight="600" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">petición recibida</text>
<rect x="120" y="62" width="86.4" height="34" rx="4" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.4"/>
<text x="163.2" y="85" font-size="18" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">/saludo/</text>
<rect x="206.4" y="62" width="86.4" height="34" rx="4" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.4"/>
<text x="249.60000000000002" y="85" font-size="18" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">{nombre}</text>
<rect x="120" y="202" width="86.4" height="34" rx="4" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.4"/>
<text x="163.2" y="225" font-size="18" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">/saludo/</text>
<rect x="206.4" y="202" width="54.0" height="34" rx="4" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.4"/>
<text x="233.4" y="225" font-size="18" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Maria</text>
<path d="M 163.2 98 L 163.2 200" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="155.2" y="155" font-size="11.5" fill="#17456f" font-weight="600" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">coincide tal cual</text>
<path d="M 249.60000000000002 98 L 233.4 200" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-ambar)"/>
<text x="263.6" y="140" font-size="11.5" fill="#8a5a12" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el valor se guarda</text>
<text x="263.6" y="155" font-size="11.5" fill="#8a5a12" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">en nombre</text>
<rect x="380" y="40" width="280" height="120" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="520" y="62" font-size="13" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">La función recibe el valor</text>
<text x="520" y="90" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">(string nombre) =&gt;</text>
<text x="520" y="110" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">$"Hola, {nombre}. Bienvenido a la plaza"</text>
<text x="520" y="140" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">aquí nombre vale Maria</text>
<path d="M 520 162 L 520 200" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<rect x="380" y="202" width="280" height="44" rx="8" fill="#f0f9f9" stroke="#0e8f8f" stroke-width="1.6"/>
<text x="520" y="222" font-size="12.5" fill="#0a6464" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Respuesta: 200</text>
<text x="520" y="238" font-size="12" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Hola, Maria. Bienvenido a la plaza</text>
<rect x="20" y="266" width="640" height="32" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="340.0" y="286.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Lo que va entre llaves en la ruta llega como argumento con el mismo nombre.</text>
</g>
</svg>
