<title id="t">Tres ciclos de vida de un servicio</title>
<desc id="d">Dos peticiones, y en cada una dos consumidores: el controlador y otroServicio. Singleton: la misma instancia A en las cuatro entregas. Scoped: la instancia B en los dos consumidores de la petición 1 y la instancia C en los dos de la petición 2. Transient: cuatro instancias distintas, D, E, F y G.</desc>
