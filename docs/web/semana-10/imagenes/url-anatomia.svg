<title id="t">Las partes de una URL</title>
<desc id="d">La URL http://localhost:5100/buscar?q=tomate dividida en cinco partes: el esquema http://, el host localhost, el puerto :5100, la ruta /buscar y el query string ?q=tomate.</desc>
