<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Mapa del pipeline completo de Plaza</title>
<desc id="d">De arriba abajo, el recorrido de GET /catalogo/2. El navegador envía la petición. Los middleware (etapa 10) la reciben: registro, puerta y archivos. La ruta con atributo HttpGet (etapa 7) elige el método. El controlador CatalogoController (etapas 7 y 8) pide el servicio ICatalogo, que el contenedor le inyecta (etapa 9). El servicio entrega el modelo Producto (etapa 7). La vista Detalle.cshtml (etapa 8), o un JSON, arma la respuesta. La respuesta 200 vuelve por los middleware hasta el navegador. Los formularios con POST (etapa 6) siguen el mismo camino.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker></defs>
<rect x="0" y="0" width="560" height="700" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="112" y="14" width="330" height="58" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="277.0" y="40.0" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Navegador</text>
<text x="277.0" y="58.0" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">GET /catalogo/2</text>
<rect x="112" y="96" width="330" height="58" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="277.0" y="122.0" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Middleware</text>
<text x="277.0" y="140.0" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Registro, Puerta, Archivos</text>
<text x="98" y="130" font-size="12" fill="#5b6876" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 10</text>
<rect x="112" y="178" width="330" height="58" rx="8" fill="#f0f9f9" stroke="#0e8f8f" stroke-width="1.6"/>
<text x="277.0" y="204.0" font-size="13.5" fill="#0a6464" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Ruta</text>
<text x="277.0" y="222.0" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">[HttpGet("catalogo/{id:int}")]</text>
<text x="98" y="212" font-size="12" fill="#5b6876" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 7</text>
<rect x="112" y="260" width="330" height="58" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="277.0" y="286.0" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Controlador</text>
<text x="277.0" y="304.0" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">CatalogoController.Detalle(2)</text>
<text x="98" y="294" font-size="12" fill="#5b6876" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapas 7 y 8</text>
<rect x="112" y="342" width="330" height="58" rx="8" fill="#f6f2fa" stroke="#7a4fa0" stroke-width="1.6"/>
<text x="277.0" y="368.0" font-size="13.5" fill="#53307a" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Servicio inyectado</text>
<text x="277.0" y="386.0" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">ICatalogo = CatalogoEnMemoria</text>
<text x="98" y="376" font-size="12" fill="#5b6876" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 9</text>
<rect x="112" y="424" width="330" height="58" rx="8" fill="#f6f8fa" stroke="#8795a3" stroke-width="1.6"/>
<text x="277.0" y="450.0" font-size="13.5" fill="#5b6876" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Modelo</text>
<text x="277.0" y="468.0" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Producto(2, Aguacate, 6000)</text>
<text x="98" y="458" font-size="12" fill="#5b6876" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 7</text>
<rect x="112" y="506" width="330" height="58" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="277.0" y="532.0" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Vista o JSON</text>
<text x="277.0" y="550.0" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">Detalle.cshtml, o la lista sola</text>
<text x="98" y="540" font-size="12" fill="#5b6876" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Etapa 8</text>
<rect x="112" y="588" width="330" height="58" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="277.0" y="614.0" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Respuesta</text>
<text x="277.0" y="632.0" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">200 con el HTML</text>
<path d="M 277.0 74 L 277.0 94" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 277.0 156 L 277.0 176" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 277.0 238 L 277.0 258" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 277.0 320 L 277.0 340" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 277.0 402 L 277.0 422" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 277.0 484 L 277.0 504" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 277.0 566 L 277.0 586" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<path d="M 444 617.0 L 482 617.0 L 482 43.0 L 446 43.0" fill="none" stroke="#2e7d5b" stroke-width="1.8" marker-end="url(#f-verde)"/>
<text transform="translate(498 290) rotate(90)" font-size="12" fill="#1f5c42" font-weight="700" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle" xml:space="preserve">la respuesta vuelve por el mismo camino</text>
<text x="14" y="674" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Un formulario con POST (etapa 6) sigue el mismo camino: el controlador recibe el cuerpo</text>
<text x="14" y="692" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">en vez de la dirección. La etapa 6 aporta GET, POST y los estados 302, 400 y 201.</text>
</g>
