<text x="475.0" y="56" font-size="10.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">{controller=Catalogo}/{action=Index}/{id?}</text>
<path d="M 312 44 L 328 44" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<text x="320" y="100" font-size="11.5" fill="#5b6876" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Se prueban en este orden hasta que una coincide</text>
