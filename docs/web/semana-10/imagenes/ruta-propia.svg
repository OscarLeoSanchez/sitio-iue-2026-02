<rect x="10" y="322" width="620" height="30" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="320.0" y="341.5" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Url.Action("Detalle", new { id = 1 }) generó /productos/1 en el catálogo.</text>
</g>
