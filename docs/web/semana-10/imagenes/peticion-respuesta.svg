<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Una petición y su respuesta</title>
<desc id="d">El navegador envía la petición GET /api/productos al servidor Plaza en localhost:5100. El servidor responde con tres partes: el estado 200 OK, el tipo de contenido application/json y el cuerpo con la lista de productos.</desc>
<defs><marker id="f-azul" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-verde" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-rojo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker><marker id="f-ambar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><marker id="f-viol" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker></defs>
<rect x="0" y="0" width="680" height="330" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="40" width="180" height="100" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6"/>
<text x="110" y="66" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Navegador</text>
<text x="110" y="88" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el cliente</text>
<text x="110" y="106" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">pide una ruta</text>
<text x="110" y="124" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">y muestra lo que llega</text>
<rect x="480" y="40" width="180" height="100" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6"/>
<text x="570" y="66" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Plaza</text>
<text x="570" y="88" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">tu servidor, en C#</text>
<text x="570" y="106" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">escucha en</text>
<text x="570" y="124" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">localhost:5100</text>
<text x="340" y="26" font-size="12" fill="#5b6876" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">tu computador</text>
<path d="M 204 70 L 476 70" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-azul)"/>
<text x="340" y="62" font-size="12" fill="#17456f" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">1. Petición</text>
<text x="340" y="87" font-size="12" fill="#17456f" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">GET /api/productos</text>
<path d="M 476 118 L 204 118" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-verde)"/>
<text x="340" y="110" font-size="12" fill="#1f5c42" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">2. Respuesta</text>
<text x="340" y="135" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">tres partes, abajo</text>
<rect x="20" y="170" width="200" height="104" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6"/>
<text x="120" y="194" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Estado</text>
<text x="120" y="224" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">200 OK</text>
<text x="120" y="252" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">salió bien</text>
<rect x="240" y="170" width="200" height="104" rx="8" fill="#f0f9f9" stroke="#0e8f8f" stroke-width="1.6"/>
<text x="340" y="194" font-size="13.5" fill="#0a6464" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Tipo de contenido</text>
<text x="340" y="224" font-size="12.5" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">application/json</text>
<text x="340" y="252" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">qué clase de dato es</text>
<rect x="460" y="170" width="200" height="104" rx="8" fill="#f6f2fa" stroke="#7a4fa0" stroke-width="1.6"/>
<text x="560" y="194" font-size="13.5" fill="#53307a" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Cuerpo</text>
<text x="560" y="224" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">[{"id":1,"nombre":"Tomate",</text>
<text x="560" y="242" font-size="11" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" xml:space="preserve">"precio":3500}, ...]</text>
<text x="560" y="262" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el dato en sí</text>
<path d="M 120 148 L 120 170" fill="none" stroke="#8795a3" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M 340 148 L 340 170" fill="none" stroke="#8795a3" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M 560 148 L 560 170" fill="none" stroke="#8795a3" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="20" y="288" width="640" height="32" rx="6" fill="#ffffff" stroke="#8795a3" stroke-width="1.2"/>
<text x="340.0" y="308.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Toda respuesta trae un estado, un tipo de contenido y, casi siempre, un cuerpo.</text>
</g>
</svg>
