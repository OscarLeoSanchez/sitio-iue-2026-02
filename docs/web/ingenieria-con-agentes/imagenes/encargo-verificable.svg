<?xml version="1.0" encoding="UTF-8"?>
<svg width="740" height="350" viewBox="0 0 740 350" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Las partes de un encargo verificable</title>
<desc id="d">Cinco cajas a la izquierda: objetivo, contexto, restricciones, criterio de terminado y verificación ejecutable. Todas entran al agente, que ejecuta el bucle hasta cumplir el criterio. El agente produce un cambio y su evidencia: el diff, el comando y su salida real. Una caja del ingeniero indica que revisa el diff y la salida antes de aceptar.</desc>
<defs><marker id="f-cielo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-hoja" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-maiz" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-tomate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-uva" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f2540" flood-opacity="0.13"/></filter></defs>
<rect x="0" y="0" width="740" height="350" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect x="20" y="14" width="210" height="52" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="125.0" y="37" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Objetivo</text>
<text x="125.0" y="59" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">qué debe quedar hecho</text>
<path d="M 232 40 L 294 136" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-maiz)"/>
<rect x="20" y="74" width="210" height="52" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="125.0" y="97" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Contexto</text>
<text x="125.0" y="119" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">qué ve el agente y qué no</text>
<path d="M 232 100 L 294 152" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-maiz)"/>
<rect x="20" y="134" width="210" height="52" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="125.0" y="157" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Restricciones</text>
<text x="125.0" y="179" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">qué no debe tocar ni cambiar</text>
<path d="M 232 160 L 294 168" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-maiz)"/>
<rect x="20" y="194" width="210" height="52" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="125.0" y="217" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Criterio de terminado</text>
<text x="125.0" y="239" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">cuándo se acepta</text>
<path d="M 232 220 L 294 184" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-maiz)"/>
<rect x="20" y="254" width="210" height="52" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6" filter="url(#sombra)"/>
<text x="125.0" y="277" font-size="12.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Verificación ejecutable</text>
<text x="125.0" y="299" font-size="10.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">un comando que lo prueba</text>
<path d="M 232 280 L 294 200" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-hoja)"/>
<rect x="298" y="104" width="150" height="112" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6" filter="url(#sombra)"/>
<text x="373.0" y="127" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Agente</text>
<text x="373.0" y="149" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">ejecuta el bucle</text>
<text x="373.0" y="167" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">hasta cumplir el</text>
<text x="373.0" y="185" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">criterio</text>
<rect x="510" y="104" width="210" height="112" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.6" filter="url(#sombra)"/>
<text x="615.0" y="127" font-size="13.5" fill="#1f5c42" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Cambio y evidencia</text>
<text x="615.0" y="149" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el diff, el comando</text>
<text x="615.0" y="167" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">y su salida real</text>
<path d="M 450 160 L 506 160" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-cielo)"/>
<rect x="298" y="254" width="422" height="60" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="509.0" y="277" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Ingeniero</text>
<text x="509.0" y="299" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">revisa el diff y la salida antes de aceptar</text>
<path d="M 615 218 L 615 252" fill="none" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#f-hoja)"/>
</g>
</svg>
