<?xml version="1.0" encoding="UTF-8"?>
<svg width="740" height="430" viewBox="0 0 740 430" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Flujo de SDD con Spec Kit y el cambio C1</title>
<desc id="d">Seis pasos de izquierda a derecha, cada uno un comando de Spec Kit: constitution, specify, clarify, plan, tasks e implement. Debajo de cada paso, el documento que produce: constitution.md con seis principios, spec.md con requisitos y criterios medibles, la sección Clarifications dentro de spec.md, plan.md con data-model.md y research.md, tasks.md con 22 tareas, y por último el código y las pruebas con evidencia. Una franja dice que el ingeniero revisa cada documento y que en esta prueba el agente respondió sus propias preguntas de clarify. Abajo, a la izquierda, el cambio C1 obligó a volver a la especificación y luego al plan, a las tareas y al código. A la derecha, lo medido: C1 tocó 7 documentos y 2 archivos de código, y C2 tocó 7 documentos para 1 línea de código.</desc>
