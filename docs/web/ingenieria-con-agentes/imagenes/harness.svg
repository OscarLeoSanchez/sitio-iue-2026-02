<text x="615.0" y="101" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">después de actuar</text>
<text x="615.0" y="119" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">compilador y pruebas</text>
<text x="615.0" y="137" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">linter</text>
<text x="615.0" y="155" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">revisión humana o</text>
<text x="615.0" y="173" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">de otro modelo</text>
<path d="M 222 130 L 271 130" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-maiz)"/>
<path d="M 467 130 L 516 130" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-cielo)"/>
<path d="M 615 206 L 615 232 L 370 232 L 370 208" fill="none" stroke="#2e7d5b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-hoja)"/>
