<text x="36" y="288" font-size="12.5" fill="#17456f" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Controles: acotan lo que el agente puede hacer</text>
