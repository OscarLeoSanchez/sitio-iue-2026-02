<title id="t">Mapa de herramientas y modelos</title>
<desc id="d">Tres columnas por modalidad. IDE: Cursor, GitHub Copilot en VS Code y Trae. Terminal: Claude Code, Codex CLI, OpenCode, Qwen Code y Kimi Code. Nube: Codex cloud, Copilot cloud agent y Claude Code web. Algunas llevan una etiqueta gratis con límites o abierto por ser de código abierto. Debajo, dos grupos de modelos: cerrados (Claude, GPT, Gemini) y abiertos (DeepSeek, Qwen, Kimi, GLM, MiniMax). Una franja dice que el ingeniero elige por costo, licencia, privacidad y facilidad de verificar.</desc>
