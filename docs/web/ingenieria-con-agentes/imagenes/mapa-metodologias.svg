<rect x="187" y="52" width="168" height="100" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="271.0" y="74" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">TDD</text>
<text x="271.0" y="95" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Pruebas en rojo</text>
<text x="271.0" y="112" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">antes de cada regla</text>
<text x="271.0" y="129" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Augmented coding</text>
<circle cx="271" cy="205" r="4.5" fill="#8795a3"/>
<line x1="364" y1="205" x2="364" y2="258" stroke="#8795a3" stroke-width="1.4"/>
<rect x="280" y="258" width="168" height="100" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="364.0" y="280" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Ciclo autónomo</text>
<text x="364.0" y="301" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Criterios de parada</text>
<text x="364.0" y="318" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">y un tope de vueltas</text>
<text x="364.0" y="335" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Auditoría en cada vuelta</text>
<circle cx="364" cy="205" r="4.5" fill="#8795a3"/>
<line x1="457" y1="152" x2="457" y2="205" stroke="#8795a3" stroke-width="1.4"/>
<rect x="373" y="52" width="168" height="100" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="457.0" y="74" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">ODD</text>
<text x="457.0" y="95" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Nada si la tarea es</text>
<text x="457.0" y="112" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">pequeña; un documento</text>
<text x="457.0" y="129" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">si es grande</text>
<circle cx="457" cy="205" r="4.5" fill="#8795a3"/>
<line x1="550" y1="205" x2="550" y2="258" stroke="#8795a3" stroke-width="1.4"/>
<rect x="466" y="258" width="168" height="100" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="550.0" y="280" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Compound</text>
<text x="550.0" y="301" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Un plan revisado y</text>
<text x="550.0" y="318" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">una nota de lo</text>
<text x="550.0" y="335" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">aprendido al cerrar</text>
<circle cx="550" cy="205" r="4.5" fill="#8795a3"/>
<line x1="643" y1="152" x2="643" y2="205" stroke="#8795a3" stroke-width="1.4"/>
<rect x="559" y="52" width="168" height="100" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="643.0" y="74" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">SDD</text>
<text x="643.0" y="95" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Constitución, spec,</text>
<text x="643.0" y="112" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">plan y tareas:</text>
<text x="643.0" y="129" font-size="11" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">varios documentos</text>
<circle cx="643" cy="205" r="4.5" fill="#8795a3"/>
<text x="20" y="386" font-size="12" fill="#3d4852" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Menos ceremonia</text>
<text x="720" y="386" font-size="12" fill="#3d4852" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Más ceremonia</text>
<text x="370" y="386" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">La ceremonia no mide la calidad: se elige según la tarea</text>
