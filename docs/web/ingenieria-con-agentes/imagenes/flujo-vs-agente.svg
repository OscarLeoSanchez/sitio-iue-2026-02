<?xml version="1.0" encoding="UTF-8"?>
<svg width="740" height="350" viewBox="0 0 740 350" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Flujo fijo frente a agente</title>
<desc id="d">Dos filas. Arriba, un flujo fijo: una entrada pasa por el paso 1 del modelo, el paso 2 del modelo y una salida, con la ruta escrita por el ingeniero en código. Abajo, un agente: el encargo llega al modelo, que decide el siguiente paso, llama a una herramienta y recibe el resultado de la acción en un ciclo, hasta entregar un resultado cuando considera que terminó.</desc>
<defs><marker id="f-cielo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="f-hoja" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="f-maiz" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="f-tomate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="f-uva" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a4fa0"/></marker><marker id="f-gris" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8795a3"/></marker><filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f2540" flood-opacity="0.13"/></filter></defs>
<rect x="0" y="0" width="740" height="350" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<text x="20" y="28" font-size="13" fill="#8a5a12" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Flujo fijo: el código decide el camino</text>
<rect x="20" y="42" width="100" height="62" rx="8" fill="#ffffff" stroke="#8795a3" stroke-width="1.6" filter="url(#sombra)"/>
<text x="70.0" y="65" font-size="13.5" fill="#16202b" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Entrada</text>
<text x="70.0" y="87" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">la tarea</text>
<rect x="160" y="42" width="140" height="62" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6" filter="url(#sombra)"/>
<text x="230.0" y="65" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Paso 1</text>
<text x="230.0" y="87" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el modelo resume</text>
<rect x="340" y="42" width="140" height="62" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6" filter="url(#sombra)"/>
<text x="410.0" y="65" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Paso 2</text>
<text x="410.0" y="87" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el modelo redacta</text>
<rect x="520" y="42" width="100" height="62" rx="8" fill="#ffffff" stroke="#8795a3" stroke-width="1.6" filter="url(#sombra)"/>
<text x="570.0" y="65" font-size="13.5" fill="#16202b" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Salida</text>
<text x="570.0" y="87" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">el resultado</text>
<rect x="640" y="42" width="80" height="62" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="680.0" y="65" font-size="12.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Ruta</text>
<text x="680.0" y="87" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">fija</text>
<path d="M 122 73 L 156 73" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<path d="M 302 73 L 336 73" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<path d="M 482 73 L 516 73" fill="none" stroke="#8795a3" stroke-width="1.6" marker-end="url(#f-gris)"/>
<line x1="20" y1="128" x2="720" y2="128" stroke="#8795a3" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20" y="156" font-size="13" fill="#17456f" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Agente: el modelo decide el camino</text>
<rect x="20" y="172" width="100" height="70" rx="8" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.6" filter="url(#sombra)"/>
<text x="70.0" y="195" font-size="13.5" fill="#8a5a12" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Encargo</text>
<text x="70.0" y="217" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">tu objetivo</text>
<rect x="170" y="172" width="150" height="70" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6" filter="url(#sombra)"/>
<text x="245.0" y="195" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Modelo</text>
<text x="245.0" y="217" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">decide el siguiente</text>
<text x="245.0" y="235" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">paso</text>
<rect x="400" y="172" width="160" height="70" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.6" filter="url(#sombra)"/>
<text x="480.0" y="195" font-size="13.5" fill="#17456f" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Herramientas</text>
<text x="480.0" y="217" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">leer, editar,</text>
<text x="480.0" y="235" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">ejecutar</text>
<path d="M 122 207 L 166 207" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#f-maiz)"/>
<path d="M 322 192 L 396 192" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-cielo)"/>
<text x="359" y="184" font-size="10.5" fill="#17456f" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">actúa</text>
<path d="M 396 224 L 322 224" fill="none" stroke="#2e7d5b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f-hoja)"/>
<text x="359" y="238" font-size="10.5" fill="#1f5c42" font-weight="600" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">resultado</text>
<rect x="170" y="276" width="150" height="56" rx="8" fill="#ffffff" stroke="#8795a3" stroke-width="1.6" filter="url(#sombra)"/>
<text x="245.0" y="299" font-size="13.5" fill="#16202b" font-weight="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Resultado</text>
<text x="245.0" y="321" font-size="11.5" fill="#5b6876" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">al terminar</text>
<path d="M 245 244 L 245 274" fill="none" stroke="#2f7bb8" stroke-width="1.6" marker-end="url(#f-cielo)"/>
<rect x="400" y="276" width="320" height="56" rx="6" fill="#fdf8ec" stroke="#b7791f" stroke-width="1.3"/>
<text x="560.0" y="300.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">Tú eliges flujo o agente según si el camino</text>
<text x="560.0" y="317.5" font-size="12" fill="#16202b" font-weight="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xml:space="preserve">se puede fijar de antemano</text>
</g>
</svg>
