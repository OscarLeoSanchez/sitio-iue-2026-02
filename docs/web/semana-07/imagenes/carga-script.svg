<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="Línea de tiempo de carga: sin defer el script en head detiene al parser y corre antes de que exista el body; con defer el parser termina primero y el script corre después, antes de DOMContentLoaded" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="fl-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker><marker id="fl-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker></defs>
  <text x="20" y="32" font-size="13" fill="#7a1f17" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">Script en head, sin defer</text>
  <rect x="20" y="46" width="150" height="54" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.8"/>
  <text x="95.0" y="69.0" font-size="11.5" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Parser: llega a</text>
  <text x="95.0" y="85.1" font-size="11.5" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">la etiqueta script</text>
  <rect x="170" y="46" width="230" height="54" rx="8" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.8"/>
  <text x="285.0" y="69.0" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Descarga y ejecuta app.js</text>
  <text x="285.0" y="85.1" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">el parser espera</text>
  <rect x="400" y="46" width="220" height="54" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.8"/>
  <text x="510.0" y="69.0" font-size="11.5" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Parser sigue: crea</text>
  <text x="510.0" y="85.1" font-size="11.5" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">form, lista, botones</text>
  <text x="285" y="124" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Aquí app.js corre y el body aún no existe:</text>
  <text x="285" y="140" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">querySelector devuelve null</text>
  <text x="20" y="196" font-size="13" fill="#1d5a40" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">Script con defer</text>
  <rect x="20" y="210" width="480" height="54" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.8"/>
  <text x="260.0" y="241.0" font-size="11.5" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Parser: lee todo el HTML y crea el DOM completo</text>
  <rect x="130" y="272" width="220" height="26" rx="8" fill="#f6f8fa" stroke="#5b6876" stroke-width="1.8"/>
  <text x="240.0" y="288.9" font-size="11" fill="#16202b" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">app.js se descarga en paralelo</text>
  <rect x="500" y="210" width="120" height="54" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.8"/>
  <text x="560.0" y="233.0" font-size="11.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Corre app.js</text>
  <text x="560.0" y="249.1" font-size="11.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">DOM completo</text>
  <path d="M 350 285 L 560 285 L 560 266" stroke="#5b6876" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#fl-gray)"/>
  <path d="M 622 237 L 700 237" stroke="#2e7d5b" stroke-width="1.6" fill="none" marker-end="url(#fl-green)"/>
  <text x="626" y="258" font-size="9.5" fill="#5b6876" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">DOMContentLoaded</text>
  <text x="360" y="334" font-size="11.5" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">defer: ejecuta después de leer el documento y antes de DOMContentLoaded, en el orden del HTML</text>
</svg>
