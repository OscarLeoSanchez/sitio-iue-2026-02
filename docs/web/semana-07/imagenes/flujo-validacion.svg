<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Flujo de validación en el submit: se cancela el envío, se leen los valores como texto, se validan, y si hay errores se muestran mensajes sin guardar; si no hay errores se guarda y se redibuja" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="fl-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="fl-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="fl-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker><marker id="fl-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker><marker id="fl-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a32d22"/></marker><marker id="fl-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0e8f8f"/></marker></defs>
  <rect x="10" y="30" width="150" height="80" rx="8" fill="#f6f8fa" stroke="#5b6876" stroke-width="1.8"/>
  <text x="85.0" y="58.5" font-size="11" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">submit</text>
  <text x="85.0" y="73.8" font-size="11" fill="#16202b" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">el usuario pulsa</text>
  <text x="85.0" y="89.2" font-size="11" fill="#16202b" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Agregar</text>
  <path d="M 160 70 L 191 70" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#fl-gray)"/>
  <rect x="193" y="30" width="150" height="80" rx="8" fill="#fff8e8" stroke="#b7791f" stroke-width="1.8"/>
  <text x="268.0" y="58.5" font-size="11" fill="#b7791f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">Cancelar envío</text>
  <text x="268.0" y="73.8" font-size="11" fill="#6b4a0c" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" style="white-space:pre">preventDefault()</text>
  <text x="268.0" y="89.2" font-size="11" fill="#6b4a0c" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">evita recargar</text>
  <path d="M 343 70 L 374 70" stroke="#b7791f" stroke-width="1.6" fill="none" marker-end="url(#fl-amber)"/>
  <rect x="376" y="30" width="150" height="80" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.8"/>
  <text x="451.0" y="58.5" font-size="11" fill="#2f7bb8" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">Leer</text>
  <text x="451.0" y="73.8" font-size="11" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">value de cada campo</text>
  <text x="451.0" y="89.2" font-size="11" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">siempre es string</text>
  <path d="M 526 70 L 557 70" stroke="#2f7bb8" stroke-width="1.6" fill="none" marker-end="url(#fl-blue)"/>
  <rect x="559" y="30" width="150" height="80" rx="8" fill="#eaf6f6" stroke="#0e8f8f" stroke-width="1.8"/>
  <text x="634.0" y="58.5" font-size="11" fill="#0e8f8f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">Validar</text>
  <text x="634.0" y="73.8" font-size="11" fill="#0a6666" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" style="white-space:pre">validar(datos)</text>
  <text x="634.0" y="89.2" font-size="11" fill="#0a6666" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">devuelve errores</text>
  <path d="M 625 112 L 625 142 L 360 142 L 360 168" stroke="#0e8f8f" stroke-width="1.6" fill="none" marker-end="url(#fl-teal)"/>
  <rect x="285" y="170" width="150" height="66" rx="8" fill="#ffffff" stroke="#5b6876" stroke-width="2.2"/>
  <text x="360.0" y="207.6" font-size="13" fill="#16202b" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">¿Hay errores?</text>
  <rect x="40" y="290" width="290" height="80" rx="8" fill="#fdf3f2" stroke="#a32d22" stroke-width="1.8"/>
  <text x="185.0" y="309.9" font-size="11.5" fill="#a32d22" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">Sí</text>
  <text x="185.0" y="326.0" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Mostrar un mensaje junto a cada campo</text>
  <text x="185.0" y="342.1" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">marcar el campo con is-invalid</text>
  <text x="185.0" y="358.2" font-size="11.5" fill="#7a1f17" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">no guardar nada</text>
  <rect x="390" y="290" width="290" height="80" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.8"/>
  <text x="535.0" y="317.9" font-size="11.5" fill="#2e7d5b" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700">No</text>
  <text x="535.0" y="334.0" font-size="11.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Agregar al arreglo</text>
  <text x="535.0" y="350.1" font-size="11.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">limpiar el formulario y redibujar</text>
  <path d="M 335 236 L 185 288" stroke="#a32d22" stroke-width="1.6" fill="none" marker-end="url(#fl-red)"/>
  <path d="M 385 236 L 535 288" stroke="#2e7d5b" stroke-width="1.6" fill="none" marker-end="url(#fl-green)"/>
</svg>
