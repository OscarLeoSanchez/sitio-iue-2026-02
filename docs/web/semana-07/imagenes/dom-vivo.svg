<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="El archivo index.html no cambia; el navegador lo lee una vez y crea el DOM en memoria; JavaScript modifica el DOM y la pantalla refleja el DOM" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="fl-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b7791f"/></marker><marker id="fl-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7bb8"/></marker><marker id="fl-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6876"/></marker></defs>
  <rect x="20" y="40" width="170" height="110" rx="8" fill="#f6f8fa" stroke="#5b6876" stroke-width="1.8"/>
  <text x="105.0" y="81.9" font-size="12.5" fill="#16202b" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Archivo index.html</text>
  <text x="105.0" y="99.4" font-size="12.5" fill="#16202b" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">en el disco</text>
  <text x="105.0" y="116.9" font-size="12.5" fill="#16202b" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" style="white-space:pre">(no cambia)</text>
  <rect x="275" y="40" width="170" height="110" rx="8" fill="#f2f7fb" stroke="#2f7bb8" stroke-width="1.8"/>
  <text x="360.0" y="81.9" font-size="12.5" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">DOM en memoria</text>
  <text x="360.0" y="99.4" font-size="12.5" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">objetos vivos</text>
  <text x="360.0" y="116.9" font-size="12.5" fill="#17456f" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">que puedes cambiar</text>
  <rect x="530" y="40" width="170" height="110" rx="8" fill="#f4faf7" stroke="#2e7d5b" stroke-width="1.8"/>
  <text x="615.0" y="81.9" font-size="12.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Pantalla</text>
  <text x="615.0" y="99.4" font-size="12.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">lo que ves</text>
  <text x="615.0" y="116.9" font-size="12.5" fill="#1d5a40" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">e interactúas</text>
  <path d="M 190 95 L 273 95" stroke="#5b6876" stroke-width="1.6" fill="none" marker-end="url(#fl-gray)"/>
  <text x="231" y="82" font-size="11.5" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">lo lee</text>
  <text x="231" y="114" font-size="11.5" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">una vez</text>
  <path d="M 445 95 L 528 95" stroke="#2f7bb8" stroke-width="1.6" fill="none" marker-end="url(#fl-blue)"/>
  <text x="486" y="82" font-size="11.5" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">se dibuja</text>
  <rect x="275" y="220" width="170" height="70" rx="8" fill="#fff8e8" stroke="#b7791f" stroke-width="1.8"/>
  <text x="360.0" y="250.8" font-size="12" fill="#6b4a0c" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Tu app.js</text>
  <text x="360.0" y="267.6" font-size="12" fill="#6b4a0c" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">createElement...</text>
  <path d="M 360 220 L 360 152" stroke="#b7791f" stroke-width="1.6" fill="none" marker-end="url(#fl-amber)"/>
  <text x="366" y="190" font-size="11.5" fill="#5b6876" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">cambia nodos</text>
  <text x="360" y="318" font-size="11.5" fill="#5b6876" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Al recargar la página, el navegador vuelve a leer el archivo y se pierden los cambios del DOM</text>
</svg>
